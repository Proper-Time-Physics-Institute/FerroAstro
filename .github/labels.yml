#
# Label taxonomy (ORG-006; issue #10): one entry per label, with `name`, `color` (six hex digits,
# no `#`) and `description`. tools/tests/test_repo_meta.py checks the format, and that every label
# named by an issue form, by tools/governance.py or by tools/oracles/drift.py is defined here.
#
# No Action syncs this file to GitHub yet: the label-sync job that ORG-006 asks for does not
# exist, and the choice of sync tool is open (OI-54). Until it exists, labels are created by hand.

# Read by the governance checks (tools/governance.py; ORG-009, TST-004, ADR-0015).
- name: "golden-change"
  color: "e99695"
  description: "Changes a golden value or tolerance"
- name: "hold"
  color: "b60205"
  description: "Stops the merge until a maintainer clears it"

# Set on the issue that tools/oracles/drift.py opens from .github/workflows/oracle-nightly.yml
# (ISSUE_LABELS; CI-006).
- name: "golden-drift"
  color: "d93f0b"
  description: "An oracle run no longer reproduces a committed golden"
- name: "blocking"
  color: "b60205"
  description: "Blocks merges until resolved"

# Taxonomy: type, area, criticality, status, agent, priority.
- name: "type:adr"
  color: "0e8a16"
  description: "Architecture decision record"
- name: "type:chore"
  color: "cfd3d7"
  description: "Maintenance, tooling, CI"
- name: "type:docs"
  color: "0075ca"
  description: "Documentation"
- name: "type:feature"
  color: "a2eeef"
  description: "New capability"
- name: "type:physics-discrepancy"
  color: "d93f0b"
  description: "Result disagrees with a cited reference value"
- name: "type:requirement"
  color: "5319e7"
  description: "Requirement definition or change"
- name: "area:ci"
  color: "c5def5"
  description: "CI/CD and oracles"
- name: "area:ephemeris"
  color: "c5def5"
  description: "Ephemerides, SPK, DE440"
- name: "area:forces"
  color: "c5def5"
  description: "Force models (Newton, J2, SR, PPN, LT, EIH)"
- name: "area:frames"
  color: "c5def5"
  description: "Reference frames"
- name: "area:integrators"
  color: "c5def5"
  description: "Numerical integrators"
- name: "area:precession"
  color: "c5def5"
  description: "Precession estimators and ladder"
- name: "area:python-tools"
  color: "c5def5"
  description: "tools/ (ruff, mypy)"
- name: "area:time"
  color: "c5def5"
  description: "Time scales"
- name: "area:units"
  color: "c5def5"
  description: "Units, newtypes, Real trait"
- name: "crit:high"
  color: "b60205"
  description: "Physics correctness or licensing"
- name: "crit:low"
  color: "0e8a16"
  description: "Nice to have"
- name: "crit:medium"
  color: "fbca04"
  description: "Important"
- name: "status:blocked"
  color: "b60205"
