#
# The evidence ratchet (TST-006, TST-004, ORG-011; ADR-0015). Two required checks:
# * `ratchet`: vectors (tolerance widened, kind downgraded, |Δvalue| > k·old tolerance, deleted,
#   blocked_by added, golden change without the maintainer-applied `golden-change` label or without
#   new evidence, computed-reference golden generated by a commit of this PR), deleted tests,
#   pytest configuration changes, Rust ignore/cfg/cfg_attr gates or Python skip/xfail/collection
#   gates (as tools/ratchet.py detects them) off the allowlist that are new on the item they stand
#   on, and requirement meta fields. For tests it is a heuristic, non-adversarial scanner: it
#   detects the `detects_*` forms of TST-006 written in ordinary syntax (as TST-006 defines it);
#   deliberately obfuscated or adversarially encoded code may evade it. Any other way of
#   skipping, deselecting, hiding or neutering a test is NOT detected; the `known_gap_*` examples
#   in TST-006 notes are non-exhaustive, and reviewers must check for the rest.
# * `ratchet (test count)`: the number of tests `cargo nextest list` would run must not fall.
# An `approval` finding passes once a maintainer approves the PR's current head SHA; the review
# re-triggers this workflow. Exact rules: tools/ratchet.py and tools/governance.py.
#
# What is compared: the PR head against git merge-base(base, head), never against the base tip.
# `main` moves on after a PR branches; comparing with the tip would report everything main gained
# since (new tests, vectors, requirement status) as removed by the PR, and stale PRs would fail.
#
# Base-SHA execution: the checker, ci/ratchet.toml and the maintainer list come from a checkout of
# the base commit; the PR head is only data. Only on the bootstrap PR, when the base has no
# tools/ratchet.py yet, the head copy runs (that PR is on the meta surface; ORG-011).
# No job that runs a checker builds or runs PR code. The test count is split in three jobs:
# `ratchet (list merge-base tests)` builds only the merge base (already reviewed code, no cache
# shared with PR builds), `ratchet (list head tests)` builds the PR, and the required
# `ratchet (test count)` downloads both listings, pinned by artifact id, and judges them with the
# base-SHA checker. A PR controls its own listing anyway (its code produces it); it cannot reach
# the merge-base listing or the checker. Deleted tests (Rust `#[test]` fns under crates/, Python
# tests under tools/, named and written in ordinary syntax) are looked for by the source scan in
# `ratchet`; doctests and the other `known_gap_*` examples are not.
#
# Security (STD-012): read-only token (contents, issues and pull-requests: read; actions: read
# only where artifacts are downloaded), no pull_request_target, actions pinned to commit SHAs,
# checkouts without persisted credentials.
name: ratchet

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  pull_request_review:
    types: [submitted, dismissed]
  merge_group:

permissions:
  contents: read

concurrency:
  group: ratchet-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}

jobs:
  static:
    name: ratchet
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      issues: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          fetch-depth: 0
          persist-credentials: false
      # No uv cache in checker jobs: a cache entry written by a job that ran PR code must never
      # feed the environment the checker runs in.
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - name: Select the checker (base SHA; head copy only on the bootstrap PR)
        id: checker
        run: |
          if [ -f base/tools/ratchet.py ]; then
            echo "dir=$GITHUB_WORKSPACE/base" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::bootstrap: the base has no tools/ratchet.py yet; running the head copy (ORG-011 review applies)"
            echo "dir=$GITHUB_WORKSPACE/head" >> "$GITHUB_OUTPUT"
          fi
      - name: Maintainer approval and golden-change label
        id: gov
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECKER: ${{ steps.checker.outputs.dir }}
        run: python3 -I "$CHECKER/tools/governance.py" flags --maintainers "$CHECKER/.github/governance/maintainers.txt"
      - name: ratchet (TST-006)
        env:
          CHECKER: ${{ steps.checker.outputs.dir }}
          APPROVED: ${{ steps.gov.outputs.approved }}
          GOLDEN: ${{ steps.gov.outputs.golden_change }}
        run: |
          flags=()
          [ "$APPROVED" = true ] && flags+=(--maintainer-approved)
          [ "$GOLDEN" = true ] && flags+=(--golden-change)
          cd "$CHECKER/tools"
          uv run --locked python ratchet.py static --base "$GITHUB_WORKSPACE/base" \
            --head "$GITHUB_WORKSPACE/head" --config "$CHECKER/ci/ratchet.toml" \
            --base-sha "$BASE_SHA" --head-sha "$HEAD_SHA" "${flags[@]}"

  list-merge-base:
    name: ratchet (list merge-base tests)
    # The PR-level count stands in the merge queue (skipped there, which counts as passing), so the
    # queue does not rebuild the workspace twice (ORG-009 acceptance 5).
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
      merge-base: ${{ steps.mb.outputs.sha }}
    steps:
      # The head commit is fetched only as git data so that the merge base can be found; the tree
      # that is built is the merge base. No rust-cache here: a cache entry written by a PR build
      # could carry PR-built binaries into this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: repo
          fetch-depth: 0
          persist-credentials: false
      - name: Check out git merge-base(base, head)
        id: mb
        run: |
          mb=$(git -C repo merge-base "$BASE_SHA" "$HEAD_SHA")
          git -C repo checkout --quiet --detach "$mb"
          echo "sha=$mb" >> "$GITHUB_OUTPUT"
          echo "merge-base: $mb"
      - name: Install pinned toolchain (rust-toolchain.toml of the merge base)
        run: cd repo && (rustup show active-toolchain || rustup toolchain install)
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      # The default nextest profile is the PR-fast tier; each tree is listed with its own
      # .config/nextest.toml, so a profile edit that filters tests out also lowers the count.
      - name: List the tests the merge base would run (nextest JSON)
        run: (cd repo && cargo nextest list --workspace --message-format json) > merge-base.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: ratchet-merge-base-list
          path: merge-base.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  list-head:
    name: ratchet (list head tests)
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      # This job builds and runs PR code (build scripts, proc macros, test binaries); nothing
      # downstream trusts anything from it except the listing it uploads, which is the PR's own.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: cd head && (rustup show active-toolchain || rustup toolchain install)
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: head -> target
      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-nextest@0.9.148
      - name: List the tests the head would run (nextest JSON)
        run: (cd head && cargo nextest list --workspace --message-format json) > head.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        id: upload
        with:
          name: ratchet-head-list
          path: head.json
          retention-days: 7
          if-no-files-found: error
          overwrite: true

  test-count:
    name: ratchet (test count)
    # Never builds or runs PR code: it reads two JSON listings and judges them with the base-SHA
    # checker. Artifacts are downloaded by the ids the listing jobs reported, so an artifact that
    # was replaced after upload (new id) is not found and the check fails closed.
    # always(): if a listing job failed or was cancelled this job must still run and fail; a
    # skipped required check would count as passing.
    if: always() && github.event_name != 'merge_group'
    needs: [list-merge-base, list-head]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      issues: read
      pull-requests: read
    steps:
      - name: Both listings exist
        env:
          MB_RESULT: ${{ needs.list-merge-base.result }}
          HEAD_RESULT: ${{ needs.list-head.result }}
        run: |
          if [ "$MB_RESULT" != success ] || [ "$HEAD_RESULT" != success ]; then
            echo "::error::ratchet (test count): listing jobs merge-base=$MB_RESULT head=$HEAD_RESULT; failing closed"
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.BASE_SHA }}
          path: base
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: hashFiles('base/tools/ratchet.py') == ''
        with:
          ref: ${{ env.HEAD_SHA }}
          path: head
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          enable-cache: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.list-merge-base.outputs.artifact-id }}
          path: lists/merge-base
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          artifact-ids: ${{ needs.list-head.outputs.artifact-id }}
          path: lists/head
      - name: Maintainer approval
        id: gov
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          dir=base; [ -f base/tools/governance.py ] || dir=head
          python3 -I "$dir/tools/governance.py" flags --maintainers "$dir/.github/governance/maintainers.txt"
      - name: ratchet (test count)
        env:
          APPROVED: ${{ steps.gov.outputs.approved }}
          MERGE_BASE: ${{ needs.list-merge-base.outputs.merge-base }}
        run: |
          dir=base; [ -f base/tools/ratchet.py ] || dir=head
          flags=()
          [ "$APPROVED" = true ] && flags+=(--maintainer-approved)
          echo "comparing head $HEAD_SHA with merge-base $MERGE_BASE"
          base_list=$(find "$GITHUB_WORKSPACE/lists/merge-base" -name merge-base.json)
          head_list=$(find "$GITHUB_WORKSPACE/lists/head" -name head.json)
          cd "$dir/tools"
          uv run --locked python ratchet.py test-count --base-list "$base_list" \
            --head-list "$head_list" "${flags[@]}"
