[[vector]]
id = "NUM014-RATE-DIFF-VS-PA"
requirement = ["NUM-014"]
quantity = "(ecliptic-of-date perihelion-longitude rate - inertial rate) - (linear-fit slope of p_A(t) from the ported p06e), both longitudes measured in the IAU 2006 J2000 ecliptic plane, linear fits over the same passages"
value = 0.0
unit = "arcsec/cy"
kind = "computed-reference"
source = "NUM-014 acceptance: 'The ecliptic-of-date result minus the inertial result ~ p_A, with both measured in the same reference plane.' p_A from ferroastro-erfa's p06e port, itself checked against pyerfa 2.0.1.5 (PYERFA-P06E-MAX-DIFF) and t_erfa_c (ERFA-T-P06E-PA); never the unverified search-snippet value of open item OI-02."
citation = "Capitaine, Wallace & Chapront 2003, A&A 412, 567 (P03); ERFA 2.0.1 p06e"
retrieved = "2026-10-15"
generated_by = "crates/ferroastro-erfa/src/precession.rs@46105a2b9354b0fe7db1abcccb3c59dae977e073"
engine = { name = "ferroastro-erfa p06e", version = "port of ERFA 2.0.1", settings = "TT = TDB - dtdb at each passage; linear least squares in TT Julian centuries" }
tolerance = { abs = 1e-3 }
tolerance_rationale = "The WP9 brief's 1e-3 arcsec/cy. Expected residual (pre-run with pyerfa, NOT blind): +4.4e-4 arcsec/cy, the second-order projection of the moving ecliptic onto the fixed plane, ~(pi_A^2/4) sin 2(Pi_A + p_A); the margin is therefore only ~2x. Check NUM014-RATE-DIFF-VS-GEOMETRY removes that term."
verified_by = "WP9 builder agent, 2026-10-15: pre-registered in IMPLEMENTATION-NOTES WP9 before the first Rust run."

[[vector]]
id = "NUM014-RATE-DIFF-VS-GEOMETRY"
requirement = ["NUM-014"]
quantity = "(ecliptic-of-date perihelion-longitude rate - inertial rate) - (linear-fit slope of the exact projected-equinox longitude -[Pi_A - atan2(sin(Pi_A + p_A) cos pi_A, cos(Pi_A + p_A))] from p06e's pi_A, Pi_A, p_A), same passages"
value = 0.0
unit = "arcsec/cy"
kind = "computed-reference"
source = "Geometry of the IAU 2006 ecliptic precession (ecliptic-to-ecliptic rotation R3(-(Pi_A + p_A)) R1(pi_A) R3(Pi_A)) with p06e's angles; the measured difference comes from ecm06 (Fukushima-Williams bias-precession), an independent parameterisation of the same P03 theory."
citation = "Capitaine, Wallace & Chapront 2003, A&A 412, 567; Hilton et al. 2006, CeMDA 94, 351, Table 1; ERFA 2.0.1 p06e note 6 ('agreement between the different parameterizations is at the 1 microarcsecond level in the present era')"
retrieved = "2026-10-15"
generated_by = "crates/ferroastro-erfa/src/precession.rs@46105a2b9354b0fe7db1abcccb3c59dae977e073"
engine = { name = "ferroastro-erfa p06e", version = "port of ERFA 2.0.1", settings = "as NUM014-RATE-DIFF-VS-PA" }
tolerance = { abs = 1e-5 }
tolerance_rationale = "ERFA documents 1 microarcsecond agreement between parameterisations; the pyerfa pre-run (NOT blind) measured 8.4e-7 arcsec/cy for this slope difference over 1969-2169. 1e-5 leaves a 10x margin."
verified_by = "WP9 builder agent, 2026-10-15: pre-registered in IMPLEMENTATION-NOTES WP9 before the first Rust run."

