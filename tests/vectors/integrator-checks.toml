# Integrator acceptance values (PHY-001, NUM-023) and the Horizons element-conversion agreement. Schema: ADR-0004.
schema_version = 1

[[vector]]
id = "PHY001-NEWTON-RATE"
requirement = ["PHY-001"]
quantity = "fitted perihelion precession rate of a Newtonian Sun + Mercury point-mass run (rung N-2B)"
value = 0.0
unit = "arcsec/cy"
kind = "analytic"
source = "Closed Kepler ellipse: the eccentricity (LRL) vector of the Newtonian two-body problem is a constant of motion, so the true rate is exactly 0. PHY-001 acceptance: |varpi_dot| < 1e-6 arcsec/cy over >= 1000 yr."
citation = "Goldstein, Poole & Safko 2002, Classical Mechanics, 3rd ed., ch. 3 (Laplace-Runge-Lenz vector); FerroAstro docs/requirements/PHY.md PHY-001"
retrieved = "2026-10-14"
tolerance = { abs = 1.0e-6 }
tolerance_rationale = "PHY-001's own bound. 1e-6 arcsec/cy is 1.2e-14 rad/orbit, i.e. about 100 ulp of the eccentricity-vector direction per orbit. Red-team section 1: the bound is integrator-specific (a Kepler-drift propagator passes trivially, a DOP853 at rtol 1e-12 may not), so it applies to the integrator the test names: FerroAstro's clean-room IAS15 (Rein & Spiegel 2015) with epsilon = 1e-9, safety = 0.25 (reject below 0.25 dt, growth capped at 4x), predictor-corrector tolerance 1e-16 (max 12 iterations), f64 with compensated summation; the test output prints these settings. The bound is far below the smallest asserted rung (LT 0.0020, PHY-011 tolerance 2e-4 arcsec/cy). Any non-zero fitted rate is integrator error."
verified_by = "WP3 builder agent, 2026-10-14: analytic (LRL conservation); bound copied from PHY-001. WP6 builder agent, 2026-10-15: rationale names the IAS15 settings (red-team section 1); value and tolerance unchanged."

[[vector]]
id = "NUM023-ENERGY-SLOPE"
requirement = ["NUM-023"]
quantity = "Brouwer-law exponent of the ensemble RMS relative energy error versus time, IAS15 in f64"
value = 0.5
unit = "1"
kind = "analytic"
source = "Brouwer 1937: unbiased round-off makes a conserved quantity random-walk, error proportional to t^(1/2). NUM-023 acceptance: within +/-0.1 of the Brouwer value."
citation = "Brouwer, D. 1937, AJ 46, 149; Rein & Spiegel 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Sec. 3.5; FerroAstro docs/requirements/NUM.md NUM-023"
retrieved = "2026-10-14"
tolerance = { abs = 0.1 }
tolerance_rationale = "NUM-023's own tolerance (+/-0.1). A systematic (biased) per-step error would give slope 1."
verified_by = "WP3 builder agent, 2026-10-14: exponent is the random-walk law; tolerance copied from NUM-023."

[[vector]]
id = "NUM023-PHASE-SLOPE"
requirement = ["NUM-023"]
quantity = "Brouwer-law exponent of the ensemble RMS mean-longitude (along-track) error versus time, IAS15 in f64"
value = 1.5
unit = "1"
kind = "analytic"
source = "Brouwer 1937: the phase error is the time integral of a random-walk mean-motion error, proportional to t^(3/2). NUM-023 acceptance: within +/-0.1 of the Brouwer value."
citation = "Brouwer, D. 1937, AJ 46, 149; Rein & Spiegel 2015, MNRAS 446, 1424, Sec. 3.5; FerroAstro docs/requirements/NUM.md NUM-023"
retrieved = "2026-10-14"
tolerance = { abs = 0.1 }
tolerance_rationale = "NUM-023's own tolerance (+/-0.1). A systematic per-step energy error would give slope 2."
verified_by = "WP3 builder agent, 2026-10-14: exponent follows from integrating a t^(1/2) mean-motion error; tolerance copied from NUM-023."

[[vector]]
id = "HORIZONS-ELEMENTS-AGREEMENT"
requirement = ["PHY-004"]
quantity = "relative difference between FerroAstro's osculating e and a and those printed by JPL Horizons for the same heliocentric state and Keplerian GM"
value = 0.0
unit = "1"
kind = "analytic"
source = "Both sides apply the same two-body formulae to the same state vector and GM, so they agree up to round-off and Horizons' 16 printed significant digits."
citation = "JPL Horizons API (https://ssd-api.jpl.nasa.gov/doc/horizons.html), EPHEM_TYPE=VECTORS and ELEMENTS for target 199, center 500@10; Murray & Dermott 1999, Solar System Dynamics, ch. 2"
retrieved = "2026-10-14"
tolerance = { abs = 1.0e-12 }
tolerance_rationale = "Horizons prints 16 significant digits (5e-17 relative rounding); the conversion loses a few digits to cancellation in e = |v x h/mu - r_hat| (e ~ 0.2) and in 1/a = 2/r - v^2/mu. 1e-12 relative is far tighter than any physics use and far looser than the few-ulp agreement expected, so a failure means a real formula or frame error."
verified_by = "WP3 builder agent, 2026-10-14: pre-registered in IMPLEMENTATION-NOTES WP3 before the first Horizons run."

[[vector]]
id = "IAS15-EQ11-EPS-EXPONENT"
requirement = ["NUM-001"]
quantity = "exponent k of the IAS15 step proposal dt_new = dt * (epsilon / b7_ratio)^k, measured as ln(p2/p1)/ln(eps2/eps1) from two first steps of identical length and state that differ only in epsilon"
value = "0.14285714285714285"
unit = "1"
kind = "analytic"
source = "Rein & Spiegel 2015, Sec. 3.3, Eq. 11: dt_required = dt_done * (epsilon / epsilon_tilde)^(1/7), epsilon_tilde = max|b7| / max|a| (global criterion). The exponent 1/7 follows from the b7 error estimate scaling as dt^7."
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Eq. 11 (arXiv:1409.4779, read for WP3; PDF sha256 8097c8e5...7e69033d)"
retrieved = "2026-10-15"
tolerance = { abs = 1.0e-12 }
tolerance_rationale = "The two runs take the identical first step, so b7 and |a| are bit-identical and only epsilon differs; the measured exponent is exact up to the rounding of powf and of the two logarithms (a few ulp of 1/7, i.e. ~1e-16 relative, amplified by 1/ln 128 ~ 0.2). 1e-12 leaves four orders of margin; the nearest wrong exponents (1/6, 1/8) are 2e-2 away. Pinned in WP6 to kill the 1/7 -> 1/6 mutant that survived every test (progress review after WP5)."
verified_by = "WP6 builder agent, 2026-10-15: exponent read in R&S 2015 Eq. 11 (WP3 clean-room reading); measured 0.5 = 2^(-7/7) for eps/128 vs 0.44545 = 2^(-7/6) under the mutant."

[[vector]]
id = "IAS15-EQ11-DEADBEAT"
requirement = ["NUM-001"]
quantity = "d ln(dt_next) / d ln(dt_first) of the IAS15 step proposal on a Kepler orbit (e = 0.5, GM = 1, from pericentre, epsilon = 1e-9), measured as log2(p(2h)/p(h)) with h the controller's own step"
value = 0.0
unit = "1"
kind = "analytic"
source = "Rein & Spiegel 2015, Eq. 11 with b7 proportional to dt^7: dt_next = dt * (epsilon / (C dt^7))^(1/7) = (epsilon / C)^(1/7), independent of the step just taken (a dead-beat controller). An exponent k gives d ln dt_next / d ln dt = 1 - 7k: -1/6 for k = 1/6, +1/8 for k = 1/8."
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Eq. 11 and Sec. 3.3"
retrieved = "2026-10-15"
tolerance = { abs = 0.05 }
tolerance_rationale = "Not blind: chosen after a WP6 probe measured +0.0112 (k = 1/7) and -0.150 (mutant k = 1/6). Justification independent of that number: b7 is not exactly proportional to dt^7 (the Radau fit mixes in O(dt^8) terms, a relative O(omega dt) ~ 1e-2 effect at ~70 steps per orbit), and the band must exclude the nearest plausible wrong exponents, |1 - 7k| = 0.167 (1/6) and 0.125 (1/8). 0.05 is below half of the smaller of these and above the O(1e-2) contamination."
verified_by = "WP6 builder agent, 2026-10-15: derived from R&S Eq. 11; values measured on the m0-foundation branch, see IMPLEMENTATION-NOTES WP6."
notes = "NEEDS HUMAN REVIEW (WP6 progress review, tagged in WP7): non-blind tolerance. The 0.05 band was fixed after the probe values were seen; a maintainer should confirm the band from the rationale alone. Value and tolerance unchanged since WP6."

[[vector]]
id = "NUM006-F64-BENCH-RATIO"
requirement = ["NUM-006"]
quantity = "ratio of the f64 IAS15 Criterion benchmark median (ias15_sun_mercury/propagate_1_julian_year, ~317 steps) after the Real refactor to the non-generic f64 baseline, each the median of 5 alternated runs on one machine"
value = 1.0
unit = "1"
kind = "analytic"
source = "NUM-006 acceptance: the f64-path benchmark is unchanged relative to a non-generic f64 baseline. Monomorphisation at f64 should emit the same machine code, so the expected ratio is exactly 1; any difference is measurement noise or a real regression."
citation = "FerroAstro docs/requirements/NUM.md NUM-006; ADR-0002 Confirmation"
retrieved = "2026-10-15"
tolerance = { rel = 0.02 }
tolerance_rationale = "PROVISIONAL (WP7 brief): 2 % on the median of 5 alternated runs. NUM-006 says 'unchanged' without a number; 2 % is above the run-to-run scatter of a median on a shared 32-thread machine and below the 10-30 % that a missed inlining or a boxed scalar would cost. NEEDS HUMAN REVIEW: confirm the band."
verified_by = "WP7 builder agent, 2026-10-15: written before the first comparison run; tools/bench_num006.py reads the band from this vector."

[[vector]]
id = "NUM010-EVENT-LOCATION"
requirement = ["NUM-010"]
quantity = "largest |t_event - t_true| of the perihelion events (r.v = 0, rising) located on the IAS15 dense-output polynomial, where t_true is the root of r.v on the integrated trajectory itself (|r.v| / |d(r.v)/dt| after integrating exactly to t_event)"
value = 0.0
unit = "s"
kind = "analytic"
source = "NUM-010 acceptance: perihelion events are located to <= 1e-6 s. The dense output is the step's own collocation polynomial, so a correct event finder puts the root of r.v where the integrated trajectory has it; the residual is the location error."
citation = "FerroAstro docs/requirements/NUM.md NUM-010"
retrieved = "2026-10-15"
tolerance = { abs = 1.0e-6 }
tolerance_rationale = "NUM-010's own bound (1e-6 s). Written in WP7 before the first run."
verified_by = "WP7 builder agent, 2026-10-15: bound copied from NUM-010; measured values in IMPLEMENTATION-NOTES WP7."

[[vector]]
id = "NUM010-KEPLER-PERIHELION-TIMES"
requirement = ["NUM-010"]
quantity = "largest |t_event - t_analytic| over 100 perihelion passages of a Keplerian Mercury-like orbit (mu = DE440 GM_sun, SW92 a and e) integrated by IAS15 in double-double; t_analytic = P/2 + k P from an aphelion start"
value = 0.0
unit = "s"
kind = "analytic"
source = "Closed Kepler ellipse: perihelion recurs every P = 2 pi sqrt(a^3/mu). NUM-010 acceptance: on a Kepler orbit the perihelion times match the analytic values to round-off. In double-double the round-off is ~1e-32 relative, so the event times are limited by the step truncation at epsilon = 1e-9 and must still meet the 1e-6 s location bound."
citation = "Murray & Dermott 1999, Solar System Dynamics, Sec. 2.4 (Kepler's third law); FerroAstro docs/requirements/NUM.md NUM-010"
retrieved = "2026-10-15"
tolerance = { abs = 1.0e-6 }
tolerance_rationale = "NUM-010's location bound applied to the double-double run, which removes round-off as an explanation. The f64 run is reported, not asserted against the analytic times: after ~7000 steps its along-track round-off (Brouwer t^(3/2), ~1e-11 rad) amounts to ~1e-5 s, which is round-off by NUM-010's own wording. Written in WP7 before the first run."
verified_by = "WP7 builder agent, 2026-10-15: analytic (Kepler's third law); measured values in IMPLEMENTATION-NOTES WP7."

[[vector]]
id = "NUM023-LONG-ENSEMBLE-KNOWN-FAILURE-ENERGY-SLOPE"
requirement = ["NUM-023"]
quantity = "KNOWN-FAILURE GUARD, not an acceptance value: Brouwer-law energy-error exponent of the pre-registered NUM-023 long ensemble (32 runs x 20 000 orbits, Sun + Mercury, IAS15 f64 defaults), as documented when the failure was recorded"
value = 0.629
unit = "1"
kind = "measured"
source = "FerroAstro nightly_num023_long_ensemble_known_failure, first recorded in WP3/WP6 and reproduced unchanged in every later review: energy slope 0.629 +/- 0.018 (fit standard error), phase 1.590, 4.89e7 steps; NUM-023 asks 0.5 +/- 0.1, so this is a FAILURE (NEEDS HUMAN REVIEW)."
citation = "FerroAstro docs/strategy/IMPLEMENTATION-NOTES.md WP6 (NUM-023 long ensemble table) and the WP7 baseline row '0.629 +/- 0.018'"
retrieved = "2026-10-20"
tolerance = { abs = 0.018 }
tolerance_rationale = "The fitted slope's own standard error as recorded with the failure. The run is deterministic, so the documented value reproduces exactly; the band only lets the guard notice when the failure WORSENS (slope > 0.647) or changes (slope < 0.611) instead of passing for any failing slope (PR #13 judge review F3). Never an acceptance tolerance: NUM-023's +/-0.1 stays in NUM023-ENERGY-SLOPE. Set after the value was measured; it widens nothing."
verified_by = "PR #13 judge-fix builder agent, 2026-10-20: value and standard error copied from IMPLEMENTATION-NOTES (WP6/WP7 tables); re-run in the PR #13 judge-fix nightly."

