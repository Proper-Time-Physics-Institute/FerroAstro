citation = "JPL DE440 ASCII header header.440 (sha256 0f4636b663e6f00af9efa2b605ef23635489f56b23dd1a5e3821d3acc6ac3359)"
retrieved = "2026-10-15"
tolerance = { abs = 0.0 }
tolerance_rationale = "A count; equality is required."
verified_by = "WP11 builder agent, 2026-10-15: counted in the header during the disclosed exploration."
notes = "kind = measured because ADR-0004 has no 'data-product fact' kind."

[[vector]]
id = "SYSTEM-REBARYCENTRE-POS-RESIDUAL"
requirement = ["NUM-018"]
quantity = "|sum mu_i* r_i / sum mu_i*| after two rebarycentring passes of the header.440 bodies (relativistic DE440 masses), f64"
value = 0.0
unit = "km"
kind = "analytic"
source = "After translating every body by the weighted mean, the weighted mean is zero up to the rounding of the translated coordinates and of the compensated weighted sums."
citation = "Definition of the barycentre; mu* per NUM-018 (Park et al. 2021 Eqs. 1-2, transcription NEEDS HUMAN REVIEW)"
retrieved = "2026-10-15"
tolerance = { abs = 1e-6 }
tolerance_rationale = "1 mm: the translated coordinates carry <= 1/2 ulp each (<= 5e-7 km for the 7.4e9 km Pluto system, whose weight is ~7e-9 of the total; ~1e-10 km for the Sun), so the weighted residual is far below 1e-6 km."
verified_by = "WP11 builder agent, 2026-10-15: fixed when writing the test, before its first run."

[[vector]]
id = "SYSTEM-REBARYCENTRE-VEL-RESIDUAL"
requirement = ["NUM-018"]
quantity = "|sum mu_i* v_i / sum mu_i*| after two rebarycentring passes of the header.440 bodies, f64"
value = 0.0
unit = "km/s"
kind = "analytic"
source = "As SYSTEM-REBARYCENTRE-POS-RESIDUAL; the weights change by O(1e-16) between passes because v_i^2 changes with the translation."
citation = "Definition of the barycentre; mu* per NUM-018"
retrieved = "2026-10-15"
tolerance = { abs = 1e-12 }
tolerance_rationale = "Velocities are <= ~50 km/s (ulp ~7e-15 km/s); 1e-12 km/s leaves two orders of magnitude for the weighted sums."
verified_by = "WP11 builder agent, 2026-10-15: fixed when writing the test, before its first run."

[[vector]]
id = "SYSTEM-HORIZONS-DE441-VS-HEADER-POS-GROSS"
requirement = ["REF-002"]
quantity = "largest |header.440 IC (DE440) - Horizons DE441 vectors| barycentric position component at JDEPOC over the Sun, Mercury..Pluto systems, Earth and Moon"
value = 0.0
unit = "km"
kind = "measured"
source = "JPL Horizons API vectors (CENTER 500@0, REF_SYSTEM ICRF, REF_PLANE FRAME, TIME_TYPE TDB, OUT_UNITS KM-S) at JD 2440400.5 TDB, assembled with InitialConditions::from_states."
citation = "JPL Horizons System, https://ssd.jpl.nasa.gov/api/horizons.api (DE441; Park et al. 2021, AJ 161, 105)"
retrieved = "2026-10-15"
tolerance = { abs = 10.0 }
tolerance_rationale = "Gross-error bound only, as HORIZONS-DE441-VS-DE440-POS-GROSS (WP10): DE441 is not DE440. A wrong frame gives ~1e7 km, a wrong centre >= 1e5 km, a 1-day epoch error >= 1e6 km. The DE440-DE441 differences are reported, not asserted."
verified_by = "WP11 builder agent, 2026-10-15: fixed in the WP11 plan before the first data run."

