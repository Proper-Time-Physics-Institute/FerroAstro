source = "FerroAstro scratch run of 2026-11-22 (issue #42 investigation, section 3.1, row `all`): 85.79 m; the WP22 follow-up recorded 86.9 m for the neighbouring configurations (IMPLEMENTATION-NOTES, WP22 review follow-up)."
