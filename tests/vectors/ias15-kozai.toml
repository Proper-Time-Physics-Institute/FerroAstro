[[vector]]
id = "IAS15-KOZAI-SCALE-STEP-RATIO"
requirement = ["NUM-001"]
quantity = "ratio of the accepted IAS15 step counts of the same Kozai-Lidov cycle integrated in two unit systems: (km, s, GM_sun = DE440 GMS) over (au, GM_sun = 1)"
value = 1.0
unit = "1"
kind = "analytic"
source = "R&S 2015 Sec. 4.3: \"One important driving factor for IAS15 was that it should be scale independent. In other words, only the dynamical properties of the system should determine the outcome, not the simulation units. We verified that IAS15 is indeed scale independent by varying the length and mass scales in Kozai-Lidov cycles. ... several integrators that we tested, including the RADAU integrator ... fail completely in this test problem if the system is simply rescaled.\" The step criterion (Eq. 11) is a ratio of accelerations, so the step sequence in units of the orbital period is the same in any unit system: ratio exactly 1 in exact arithmetic."
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Sec. 4.3 \"Kozai-Lidov cycles\" and Fig. 5 (arXiv:1409.4779 PDF, sha256 8097c8e50d16edc1527ec05e6680fc68d6f91e4d027dec16c762a6ce7e69033d, read 2026-11-23)"
retrieved = "2026-11-23"
tolerance = { rel = 1.0e-2 }
tolerance_rationale = "Fixed before any run. The two runs round differently (the scale factors are not powers of two), so the trajectories separate at round-off level and the cycle end, detected at an accepted step where e crosses 0.1, can shift by a short-period oscillation: half an outer period is ~13 binary periods out of a few thousand, ~0.5 %. 1 % covers that. A step control that carries an absolute length or time scale (the failure the paper describes for RADAU) changes the count by factors, not per cent: the two unit systems differ by 1.5e8 in length and 5e6 in time. Both runs must also each meet IAS15-KOZAI-EMAX, -ENERGY-ERROR, -ANGMOM-ERROR and -CYCLE-BINARY-ORBITS."
verified_by = "M1-exit agent (Claude, FerroAstro session), 2026-11-23: read in the arXiv PDF (sha256 in citation), Sec. 4.3. PRE-REGISTERED: committed before the Kozai test existed or had been run."
