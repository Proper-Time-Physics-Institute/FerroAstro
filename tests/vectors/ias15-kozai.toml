[[vector]]
id = "IAS15-KOZAI-EMAX"
requirement = ["NUM-001"]
quantity = "largest osculating eccentricity of the inner binary (two-body elements of the relative orbit, mu = G(m1+m2)) over one Kozai-Lidov cycle, sampled after every accepted IAS15 step"
value = 0.992
unit = "1"
kind = "measured"
source = "R&S 2015 Sec. 4.3: \"a central binary with masses of 1 Msun each, separated by 1 AU, and a perturber, also with mass 1 Msun at a distance of 10 AU. The inclination of the perturber's orbit with respect to the plane of inner binary orbit is 89.9 deg. The highest eccentricity of the binary during one Kozai cycle is emax ~ 0.992. We integrate one full Kozai cycle\""
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Sec. 4.3 \"Kozai-Lidov cycles\" and Fig. 5 (arXiv:1409.4779 PDF, sha256 8097c8e50d16edc1527ec05e6680fc68d6f91e4d027dec16c762a6ce7e69033d, read 2026-11-23)"
retrieved = "2026-11-23"
tolerance = { abs = 5.0e-3 }
tolerance_rationale = "The paper prints emax to three figures with an approximately sign and does not state the initial phases, so the published value cannot be met to better than its rounding plus the phase dependence. Phase dependence, estimated before any run: the non-secular (single-averaging) parameter is eps_SA = (a1/a2)^(3/2) * (m3^2 / ((m1+m2)(m1+m2+m3)))^(1/2) = 10^(-3/2) * 6^(-1/2) = 0.0129; it sets the size of the outer-orbit-period fluctuation of the binary's normalised angular momentum j = sqrt(1-e^2). At emax = 0.992, j = 0.126 and de = (j/e) dj, so dj ~ +/-0.02 gives de ~ +/-0.0025; 0.005 is twice that. Independent corroboration of the published value (my own derivation, not the oracle): the quadrupole secular model for an initially circular binary, with conserved total angular momentum and a circular outer orbit, gives cos^2(i) = (cos^2(i0) + 3e^2)/(1 + 4e^2) at the maximum and cos(i) j + (beta/2) j^2 = cos(i0) + beta/2 with beta = L1/L2 = 0.1937 for these masses and separations; its root is j = 0.1255, emax = 0.9921 (the test-particle formula sqrt(1 - (5/3) cos^2 i0) would give 0.9999975, so the bound separates the two). 0.005 also rejects a run that never reaches high eccentricity."
verified_by = "M1-exit agent (Claude, FerroAstro session), 2026-11-23: read in the arXiv PDF (sha256 in citation), Sec. 4.3. PRE-REGISTERED: committed before the Kozai test existed or had been run."
notes = "Initial conditions chosen by the test (not stated in the paper): G = 1 units scaled to the unit system under test; inner relative orbit circular in the x-y plane, r = (a1, 0, 0), v = (0, sqrt(G(m1+m2)/a1), 0); perturber relative to the binary barycentre r = (a2, 0, 0), v = sqrt(G(m1+m2+m3)/a2) (0, cos i, sin i); total barycentre at rest at the origin (R&S 2015 Sec. 3.6 on offsets from the origin). One cycle: from t = 0 until the first accepted step with e < 0.1 after e has exceeded 0.5. Integrator: Ias15Config::default() (epsilon = 1e-9), f64."

[[vector]]
id = "IAS15-KOZAI-CYCLE-BINARY-ORBITS"
requirement = ["NUM-001"]
quantity = "length of one Kozai-Lidov cycle of the R&S 2015 test in initial binary periods (from t = 0 until the eccentricity has returned below 0.1 after exceeding 0.5)"
value = 5500
unit = "1"
kind = "measured"
source = "R&S 2015 Sec. 4.3: \"we only integrated this system for one Kozai-Lidov cycle (a few thousand binary orbits)\""
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Sec. 4.3 \"Kozai-Lidov cycles\" and Fig. 5 (arXiv:1409.4779 PDF, sha256 8097c8e50d16edc1527ec05e6680fc68d6f91e4d027dec16c762a6ce7e69033d, read 2026-11-23)"
retrieved = "2026-11-23"
tolerance = { abs = 4500.0 }
tolerance_rationale = "\"A few thousand\" is read as between 1000 and 10000; value and tolerance encode that interval, [1000, 10000]. Order-of-magnitude check made before any run: t_K ~ ((m1+m2)/m3) P_out^2/P_in = 2 * (1000/3 yr^2) / (0.7071 yr) = 943 yr = 1333 binary periods, times a factor of order a few (logarithmic in the initial eccentricity for a circular start). The upper end is also the test's integration cap: a run whose cycle has not completed after 10000 binary periods fails."
verified_by = "M1-exit agent (Claude, FerroAstro session), 2026-11-23: read in the arXiv PDF (sha256 in citation), Sec. 4.3. PRE-REGISTERED: committed before the Kozai test existed or had been run."

[[vector]]
id = "IAS15-KOZAI-ENERGY-ERROR"
requirement = ["NUM-001"]
quantity = "largest relative energy error |E - E0|/|E0| of the three-body system over one Kozai-Lidov cycle, IAS15 in f64 at the default epsilon, sampled after every accepted step (energy evaluated in double-double from the f64 state)"
value = 0.0
unit = "1"
kind = "measured"
source = "R&S 2015 Sec. 4.3: \"IAS15 preserves the energy with a precision 10^-12 and the angular momentum with a precision of 10^-15 in all simulations\" (Fig. 5, all values of epsilon_b including the canonical 1e-9). Energy is an exact integral of the Newtonian three-body problem, so the true value is 0."
citation = "Rein, H. & Spiegel, D. S. 2015, MNRAS 446, 1424, doi:10.1093/mnras/stu2164, Sec. 4.3 \"Kozai-Lidov cycles\" and Fig. 5 (arXiv:1409.4779 PDF, sha256 8097c8e50d16edc1527ec05e6680fc68d6f91e4d027dec16c762a6ce7e69033d, read 2026-11-23)"
retrieved = "2026-11-23"
tolerance = { abs = 1.0e-11 }
tolerance_rationale = "The paper's figure is an order of magnitude read from a logarithmic plot (10^-12), for one unstated choice of phases and one libm/compiler. The bound is that figure with one decade of margin, fixed before any run: 1e-11. It applies to the worst sample of the cycle, not only the final one, which is the stricter reading. The energy is evaluated in double-double so that the bound measures the integration, not the f64 evaluation floor (near pericentre at e = 0.992 the binary's kinetic and potential terms are each ~1/(1-e) = 125 times its binding energy)."
verified_by = "M1-exit agent (Claude, FerroAstro session), 2026-11-23: read in the arXiv PDF (sha256 in citation), Sec. 4.3. PRE-REGISTERED: committed before the Kozai test existed or had been run."

