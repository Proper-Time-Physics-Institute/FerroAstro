# WP14: Park et al. 2017 Table 3 per-planet Newtonian contributions (PHY-012, NUM-013(b)) and the planet-pair
# interaction rows (informational). ADR-0014 (maintainer decision C of 2026-10-20, requirements PR #19): the seven
# single-planet rows GATE under P-remove = rate(full) - rate(full - X) and carry `provisional = "OI-38"`, because
# P-remove was chosen after the WP14/WP17 results were known and Park's own protocol is not yet confirmed against
# the Park 2017 text (OI-38). P-add (pre-registered) is reported, not asserted. The pair rows stay informational
# (blocked_by OI-38, never asserted). The asteroid row (PHY-019) gates under P-remove independently of OI-38.
# Derivations: docs/strategy/IMPLEMENTATION-NOTES.md, WP14, WP15, WP17 and the ADR-0014 section.
schema_version = 1

[[vector]]
id = "PARK17-T3-VENUS"
requirement = ["PHY-012", "NUM-013"]
quantity = "contribution of Venus to the precession rate of Mercury's perihelion, Mercury mean-orbit frame (Park17 Table 3 row 'Venus')"
value = "277.4176"
unit = "arcsec/cy"
kind = "measured"
source = "Park17 Table 3, row 'Venus': 277.4176 +/- <0.0001 arcsec/Julian century"
citation = 'Park, R. S., Folkner, W. M., Konopliv, A. S., et al. 2017, AJ 153, 121, doi:10.3847/1538-3881/aa5be2, Table 3'
retrieved = "2026-10-15"
tolerance = { abs = 0.005 }
tolerance_rationale = "PHY-012 acceptance (each value within +/- 0.005 arcsec/cy), copied; NUM-013(b) uses the same bound; value and tolerance unchanged since WP14. ASSERTED under P-remove = rate(full) - rate(full - X), identical ICs, one estimator, per ADR-0014 (maintainer decision C of 2026-10-20, requirements PR #19). PROVISIONAL (provisional = OI-38): P-remove was chosen AFTER the results were known. P-add = rate(Sun + Mercury + X) - rate(Sun + Mercury) was pre-registered (WP14) and missed 4 of 7 rows (IMPLEMENTATION-NOTES WP14: Venus -0.022706, Earth/Moon -0.018997, Jupiter +0.038832, Saturn +0.043049 arcsec/cy; WP17: P-add Venus -0.029820 on the forward window, the same for FerroAstro, REBOUND, Mercury6 and Swiftest to 2e-8). This row in WP14: P-remove 277.418142 (+0.000542), P-add 277.394894 (-0.022706, OUTSIDE); P-add is now reported, not asserted. A pass therefore means consistent with Park 2017 under P-remove, not protocol-independent agreement; the bound is tighter than the protocol ambiguity (cross terms up to 0.0411; red-team PHY-012 finding). REVERT CONDITION: if a maintainer's reading of the Park 2017 text (OI-38) says P-add, this row reverts to asserting P-add and the 4 P-add misses are real discrepancies (type:physics-discrepancy)."
