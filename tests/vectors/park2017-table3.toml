[[vector]]
id = "PARK17-T3-VENUS"
requirement = ["PHY-012", "NUM-013"]
quantity = "contribution of Venus to the precession rate of Mercury's perihelion, Mercury mean-orbit frame (Park17 Table 3 row 'Venus')"
value = "277.4176"
unit = "arcsec/cy"
kind = "measured"
source = "Park17 Table 3, row 'Venus': 277.4176 +/- <0.0001 arcsec/Julian century"
citation = 'Park, R. S., Folkner, W. M., Konopliv, A. S., et al. 2017, AJ 153, 121, doi:10.3847/1538-3881/aa5be2, Table 3'
retrieved = "2026-10-15"
tolerance = { abs = 0.005 }
tolerance_rationale = "PHY-012 acceptance (each value within +/- 0.005 arcsec/cy), copied; NUM-013(b) uses the same bound. FerroAstro computes the row with the maintainer protocol P-add = rate(Sun + Mercury + X) - rate(Sun + Mercury), identical ICs, one estimator (WP14 pre-registration). Non-gating while OI-38 (Park's own protocol) is open; red-team PHY-012 finding: the bound is tighter than the protocol ambiguity (cross terms up to 0.0411)."
