# DE440 constants asserted by PHY-002 and REF-002 (WP2). Schema: ADR-0004.
# Oracles are the DE440 paper (Park21, independent of the header file), the SI/IAU definitions
# (defined-constants.toml) and the REF-002 acceptance text. No header.440 value is reproduced here
# (maintainer decision 2026-11-14, #22): FerroAstro reads the hash-pinned header at run time, and the
# values only the header states (GMS in au^3/d^2, J2SUN, OMGSUN in rad/d, EMRAT to 18 digits) are
# checked by the live cross-check SYSTEM-HEADER-LIVE-CROSSCHECK-MAX-ULP (data and oracle tiers),
# not by committed numbers. GMSDOT (OI-04) and CENTER (OI-23) are deliberately absent.
# IAU 2015 B3 nominal values live in iau2015-nominal.toml (PHY-003).
schema_version = 1

[[vector]]
id = "DE440-GMS-KM3S2"
requirement = ["PHY-002"]
quantity = "heliocentric gravitational constant GM of the Sun (DE440 GMS)"
value = "132712440041.279419"
unit = "km^3/s^2"
kind = "measured"
source = "Park21 Table 2: GMSun 132712440041.279419 km3 s-2 (estimated from DE440)"
citation = "Park, R. S., Folkner, W. M., Williams, J. G. & Boggs, D. H. 2021, AJ 161, 105, doi:10.3847/1538-3881/abd414, Table 2"
retrieved = "2026-10-14"
tolerance = { rel = 1.0e-15 }
tolerance_rationale = "The header prints GMS in au^3/d^2 to 18 digits; converting that decimal exactly with AU (km) and 86400 s/d lands 2.2e-16 relative from Park21's 18-digit print. The f64 path adds a few roundings (each <= 1.1e-16). 1e-15 covers both with ~4x headroom and is still 3e5 times tighter than the 3e-10 GM-vs-IAU-nominal difference."
verified_by = "WP2 builder agent, 2026-10-14: read in the published PDF (iopscience.iop.org/article/10.3847/1538-3881/abd414/pdf, sha256 96c3945deb12e0f0843c2bf0703d3542d950cf85ff903b1fe11a501634f68ee0); also equals PHY-002 acceptance."

[[vector]]
id = "DE440-EMRAT"
requirement = ["PHY-002", "REF-002"]
quantity = "Earth/Moon mass ratio (DE440 EMRAT)"
value = "81.3005682290799"
unit = "1"
kind = "measured"
source = "Park21 Table 2: GMEarth / GMMoon = 398600.435507 / 4902.800118 (km3 s-2 each), computed with 40-digit decimal arithmetic and rounded to 15 significant digits. DE440 EMRAT itself is read from header.440 at run time and is not reproduced here (#22)."
citation = "Park, R. S., Folkner, W. M., Williams, J. G. & Boggs, D. H. 2021, AJ 161, 105, doi:10.3847/1538-3881/abd414, Table 2"
retrieved = "2026-11-14"
tolerance = { rel = 1.04e-10 }
tolerance_rationale = "Worst case of the printed rounding of the two Park21 GMs (6 decimals each, i.e. +/- 5e-7 km^3/s^2): 5e-7/398600.435507 + 5e-7/4902.800118 = 1.0324e-10 relative, rounded up to 1.04e-10. Derived from the print precision before comparing with the header; it is not tuned to the header's value. The 15-digit rounding of the ratio adds < 1e-15."
verified_by = "WP2 builder agent, 2026-10-14 (header comparison); re-sourced to Park21 Table 2 by the #22 author agent, 2026-11-14, ratio recomputed with Python decimal (prec 40). Re-sourced 2026-11-14 (#22, golden-change): the repository no longer reproduces header.440 values; the header is read at run time and its parse is cross-checked live (SYSTEM-HEADER-LIVE-CROSSCHECK-MAX-ULP)."

