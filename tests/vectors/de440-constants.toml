# DE440 constants asserted by PHY-002 and REF-002 (WP2). Schema: ADR-0004.
# Oracles are the DE440 paper (Park21, independent of the header file) and, for values that only the
# header states, the pinned header.440 itself; the latter are regression pins against loading a
# different ephemeris, not independent checks. GMSDOT (OI-04) and CENTER (OI-23) are deliberately absent.
# IAU 2015 B3 nominal values live in iau2015-nominal.toml (PHY-003).
schema_version = 1

[[vector]]
id = "DE440-GMS-KM3S2"
requirement = ["PHY-002"]
quantity = "heliocentric gravitational constant GM of the Sun (DE440 GMS)"
value = "132712440041.279419"
unit = "km^3/s^2"
kind = "measured"
source = "Park21 Table 2: GMSun 132712440041.279419 km3 s-2 (estimated from DE440)"
citation = "Park, R. S., Folkner, W. M., Williams, J. G. & Boggs, D. H. 2021, AJ 161, 105, doi:10.3847/1538-3881/abd414, Table 2"
retrieved = "2026-10-14"
tolerance = { rel = 1.0e-15 }
tolerance_rationale = "The header prints GMS in au^3/d^2 (0.295912208284119561D-03); converting that 18-digit decimal exactly with AU = 149597870.7 km and 86400 s/d gives 132712440041.2794478 km^3/s^2, 2.2e-16 relative from Park21's 18-digit print. The f64 path adds a few roundings (each <= 1.1e-16). 1e-15 covers both with ~4x headroom and is still 3e5 times tighter than the 3e-10 GM-vs-IAU-nominal difference."
verified_by = "WP2 builder agent, 2026-10-14: read in the published PDF (iopscience.iop.org/article/10.3847/1538-3881/abd414/pdf, sha256 96c3945deb12e0f0843c2bf0703d3542d950cf85ff903b1fe11a501634f68ee0); also equals PHY-002 acceptance."

