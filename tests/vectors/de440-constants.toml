tolerance_rationale = "The oracle is quoted to 12 decimals; half a unit in the 12th decimal is 5e-13 rad/d. The header value differs from it by 2.9e-15 rad/d. FerroAstro stores the rate in rad/s and the test multiplies back by 86400 s/d (a few 1e-17 rad/d of rounding)."
verified_by = "WP2 builder agent, 2026-10-14: compared with the downloaded header.440 and PHY-002. The unit rad/d is corroborated by PARK21-OMGSUN-DEGD."

