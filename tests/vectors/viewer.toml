[[vector]]
id = "VIEWER-E14-VARPI-IDENTITY"
requirement = ["API-004", "NUM-011"]
quantity = "max over passages of |dog_leg_angle(e, h x e) - dog_leg_angle(r, v)| on the Park17 plane (osculating varpi from the eccentricity vector vs from the passage state), 20 yr"
value = 0.0
unit = "rad"
kind = "analytic"
source = "At a perihelion the position is along the eccentricity vector and v is along h x e, so both give Omega + omega (DESIGN section 6.1)."
citation = "docs/viewer/DESIGN.md section 6.1 and section 8 E14"
retrieved = "2026-11-14"
tolerance = { abs = 5.0e-9 }
tolerance_rationale = "DESIGN E14 proposed 1e-9 rad; measured 1.24e-9 rad (2026-11-14, Venus + Jupiter + GR, 20 yr). The identity is exact at r.v = 0; the Lagrange-interpolated passage leaves |r.v|/(|r||v|) <= 2.1e-10 (r and v come from their own interpolants, the root from the interpolated r.v), and e = (v^2/mu - 1/r) r - (r.v) v/mu then turns away from r by (r.v)/(|r||v|) (1 + e)/e = 1.23e-9 rad, which accounts for the whole difference. 5e-9 keeps a factor 4 over that bound; a wrong varpi definition (e.g. node on another plane) misses by >= 1e-6 rad."
verified_by = "Viewer engine builder, 2026-11-14: the first run exceeded the design's 1e-9 (1.236e-9); the bound was widened only after the residual was derived and printed by the test (worst angle = max |r.v|/(|r||v|) x (1 + e)/e). NEEDS HUMAN REVIEW."

