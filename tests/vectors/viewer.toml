# Orbit viewer (API-004, docs/viewer/DESIGN.md section 8): expectations and tolerances of the
# viewer's native tests. The expected rates are the repository's cited values (PHY-004, PHY-007/008,
# PHY-010, PHY-011, Park17 Table 3); the tolerances are the design's, written there before the
# implementation. The short-window planetary tolerances are PROVISIONAL (DESIGN section 11 item 3):
# the tests report the measured deviation and must not be tightened without evidence. No value here
# is copied from JPL header.440 (#22): the System-mode tests read it from the build-time embedded
# file (feature embed-header) and skip without it.
# Schema: ADR-0004.
schema_version = 1

[[vector]]
id = "VIEWER-E1-KEPLER-RATE"
requirement = ["API-004", "PHY-001"]
quantity = "perihelion rate of the Kepler-only baseline (toggle mask 0: Sun + Mercury, Newtonian), Park17 mean-orbit frame, 100 yr from JDEPOC, WHFast h = 1 d and IAS15 eps = 1e-9"
value = 0.0
unit = "arcsec/cy"
kind = "analytic"
source = "The two-body Newtonian orbit does not precess (PHY-001); DESIGN E1."
citation = "Murray & Dermott 1999, Solar System Dynamics, Sec. 2.4 (fixed Kepler ellipse); docs/viewer/DESIGN.md section 8 E1"
retrieved = "2026-11-14"
tolerance = { abs = 1.0e-3 }
tolerance_rationale = "DESIGN E1: the integrator floor over 100 yr; a missing or wrong force term (e.g. a stray solar J2) moves the rate by >= 0.03 arcsec/cy."
verified_by = "Viewer engine builder, 2026-11-14: tolerance copied from DESIGN E1 before the tests ran."

