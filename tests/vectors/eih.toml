[[vector]]
id = "EIH-R3-LIMIT-TOTAL-REL"
requirement = ["NUM-017"]
quantity = "relative difference |a_EIH - a_R3| / |a_R3| of Mercury's total acceleration (Newtonian + 1PN) in the R5 -> R3 limit: Mercury massless at its header.440 state relative to the Sun, the Sun at rest; EIH = NewtonianMutual + Eih vs TestParticle(Newtonian + SchwarzschildPpn)"
value = 0.0
unit = "1"
kind = "analytic"
source = "The R5 -> R3 limit is an exact identity (tools/eih_limit.py checks it symbolically); the numerical difference is round-off only."
citation = "Park et al. 2021, AJ 161, 105, Eq. 27; FerroAstro NUM-017 acceptance; WP19 task text (1e-15 relative); WP19 plan check C2a"
retrieved = "2026-10-20"
tolerance = { abs = 1.0e-15 }
tolerance_rationale = "From the WP19 task text. The Newtonian parts are computed in different operation orders (a few ulp of a 4e-5 km/s^2 vector, ~4e-16 relative); the 1PN parts are 2.5e-8 of the total, so their round-off does not reach this level."
verified_by = "WP19 builder agent, 2026-10-20: fixed in the WP19 plan before the first run."

