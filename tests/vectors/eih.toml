[[vector]]
id = "EIH-ITERATION-C4-FACTOR"
requirement = ["NUM-018"]
quantity = "upper bound on max_i |a_i(iterated) - a_i(default)| / (eps^2 |a_N,i|), eps = max_i U_i / c^2, Sun + 8 planets + Moon at the header.440 epoch"
value = 0.0
unit = "1"
kind = "defined"
source = "NUM-018 acceptance: the iterated-minus-default difference is within the expected O(c^-4) magnitude. The iteration changes a_j on the RHS by its 1PN correction (O(eps) relative), which enters Eq. 27 at O(c^-2): O(eps^2) relative."
citation = "FerroAstro docs/requirements/NUM.md NUM-018; WP19 plan check C5b"
retrieved = "2026-10-20"
tolerance = { abs = 100.0 }
tolerance_rationale = "A factor 100 on the order-of-magnitude estimate. Iterating with the full a_j instead of its correction would give ~1/eps ~ 4e7 times more and fail."
verified_by = "WP19 builder agent, 2026-10-20: fixed in the WP19 plan before the first run."

