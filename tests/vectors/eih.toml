[[vector]]
id = "EIH-TIER-SINGLE-MINOR-REL"
requirement = ["NUM-009", "NUM-020", "PHY-014"]
quantity = "max over the moving bodies of |delta a_1 - delta a_2| / |delta a_2| between two evaluations of the c^-2 part of Eq. 27 that must agree exactly: (E1) Sun + 8 planets + Moon + Ceres from header.440/REF-003 with Ceres Minor vs Major; (E2) the production term over the tiered interaction graph vs an independent O(N^3) evaluation of Eq. 27 with an explicit edge predicate (synthetic system with heavy Minor bodies and Ring masses)"
value = 0.0
unit = "1"
kind = "analytic"
source = "Exact identities: with a single Minor body the tiered graph (no Minor-Minor, no Ring-Ring edge) is the complete graph, so Minor and Major give the same sums; the E2 reference implements the same set rules from the typeset Eq. 27. Only the floating-point summation orders differ."
citation = "Park et al. 2021, AJ 161, 105, Eq. 27; maintainer decision D1 of 2026-10-21 (NUM-009, NUM-020, PHY-014 notes); WP22 plan checks E1, E2"
retrieved = "2026-11-12"
tolerance = { abs = 1.0e-13 }
tolerance_rationale = "About 450 ulp, as EIH-R3-LIMIT-CORRECTION-REL: round-off of different summation orders. A wrong set rule (a missing source, potential or acceleration term) changes a body's correction at O(GM_source/GM_dominant) or more, which is >= 1e-10 for Ceres' own correction and O(1e-2) for the heavy synthetic Minor bodies."
verified_by = "WP22 builder agent, 2026-11-12: fixed in the WP22 plan before the first run."

[[vector]]
id = "EIH-MUSTAR-RATE-FD-REL"
requirement = ["NUM-018"]
quantity = "max_i |mu*'_i - [mu*_i(t+d) - mu*_i(t-d)]/(2d)| / max_i |mu*'_i|, d = 60 s, mu*' from mu_star_rate, the shifted states from the second-order Taylor flow under the Newtonian accelerations, double-double, header.440 Sun + 8 planets + Moon (barycentric)"
value = 0.0
unit = "1"
kind = "analytic"
source = "mu*'_i = (GM_i/c^2)[v_i.a_i + (1/2) sum_j GM_j (r_ij.v_ij)/r_ij^3] is the time derivative of Park et al. 2021 Eq. 2 (DE430 Eq. 2). A central difference converges to it as d^2 (the Taylor-flow errors are odd in d and enter at the same order)."
citation = "Park et al. 2021, AJ 161, 105, Eq. 2; Folkner et al. 2014, IPN PR 42-196, Eqs. 2-3; Subbotin et al. 2023, arXiv:2304.04458v1, Eq. 5; NUM-018 sign-off (OI-75); WP22 plan check E5"
retrieved = "2026-11-12"
tolerance = { abs = 1.0e-6 }
tolerance_rationale = "Truncation O((omega d)^2): the Moon is fastest, (2.7e-6 rad/s x 60 s)^2/6 ~ 4e-9; the m5-performance WP25 run measured 3.9e-6 at d = 1 h, which scales by (60/3600)^2 to 1.1e-9. The bound leaves ~1000x for higher-order terms; a wrong coefficient (the 1/2, a sign, a missing v.a) is O(1)."
verified_by = "WP22 builder agent, 2026-11-12: fixed in the WP22 plan before the first run."

