# ---- Derived targets, acceptance (a): GPS satellite minus ground clock ----

[[vector]]
id = "PHY022-GPS-ROT-S"
requirement = ["PHY-022"]
quantity = "GPS satellite minus rotating equatorial ground clock, metric proper time s of g = Omega^2 eta (derived, not observed)"
value = 38.54129
unit = "us/day"
kind = "analytic"
source = "rd#88 package table 'gps-table' (section 6.3, rotating ground): 38.54129 us/day; source report REPORT_tau_and_hamiltonian.md section 2.4: +38.54. Supported-clock assumption H10. Observed context: +38.57 with J2 (Ashby 2003)"
citation = "relativistic-dynamics research/2026-11-14/rd88-proper-time-hamiltonian-static-metric/derivation.md section 6.3 (witness gps-table, checks.py); Ashby, N. 2003, Living Rev. Relativ. 6, 1, doi:10.12942/lrr-2003-1 (observational context)"
retrieved = "2026-11-15"
tolerance = { abs = 1.0e-5 }
tolerance_rationale = "Half a unit in the last printed digit (5e-6) plus margin. The expansion is not a limit: the diagnostic uses the exact Omega and sqrt(1 - v^2/c^2) rates of the package, and the first-order formula of the report differs by O(U^2) x 86400e6 = 3e-9 us/day. The integration floor (IAS15 circular orbit over one day, 8-point Gauss-Legendre per step, offsets carried as rate - 1) is below 1e-8 us/day."
verified_by = "Three-clock PR author, 2026-11-15: recomputed 38.5412885 from the exact rates in Python with the inputs above; the package's checks.py prints 38.54129."

