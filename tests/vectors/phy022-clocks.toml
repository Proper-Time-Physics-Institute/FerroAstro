citation = "IERS Conventions (2010), IERS Technical Note 36, eq. 5.14 in the electronic update of 10 August 2012 (Earth Rotation Angle) and Table 1.1 (rate of advance of ERA, defining constant); relativistic-dynamics research/2026-11-14/rd88-proper-time-hamiltonian-static-metric/derivation.md section 6.3"
