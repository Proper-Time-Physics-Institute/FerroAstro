# ---- Derived targets, acceptance (b): Galileo 5/6 eccentricity-periodic amplitude ----

[[vector]]
id = "PHY022-GALILEO56-PERIODIC-S"
requirement = ["PHY-022"]
quantity = "Galileo 5/6 (a = 27977 km, e = 0.162) eccentricity-periodic clock amplitude, half peak-to-peak of the detrended offset over one orbit, metric proper time s (derived, not observed)"
value = 380.6914
unit = "ns"
kind = "analytic"
source = "rd#88 package table 'periodic-terms' (section 6.4): 380.6914 ns = 2 sqrt(GM a) e / c^2; source report section 2.4: 380.7. The standard GPS/GNSS eccentricity correction (Ashby 2003); Delva et al. 2018 used this term on Galileo 5/6 to measure the redshift"
citation = "relativistic-dynamics research/2026-11-14/rd88-proper-time-hamiltonian-static-metric/derivation.md section 6.4 (witness periodic-terms); Ashby, N. 2003, Living Rev. Relativ. 6, 1, doi:10.12942/lrr-2003-1; Delva, P. et al. 2018, Phys. Rev. Lett. 121, 231101, arXiv:1812.03711 (observational context)"
retrieved = "2026-11-15"
tolerance = { abs = 1.0e-4 }
tolerance_rationale = "Half a unit in the last printed digit (5e-5 ns) plus margin. Expansion: the exact rates differ from the first-order Kepler integral by O(U^2) terms whose periodic part is about e U^2 / n = 3e-8 ns. Integration: one IAS15 orbit (closure about 1e-15 relative), 8-point Gauss-Legendre per step, extrema on a uniform grid of 8000 points refined by a parabola (grid error below 1e-9 relative, i.e. < 1e-6 ns)."
verified_by = "Three-clock PR author, 2026-11-15: 2 sqrt(GM a) e / c^2 = 380.69140 ns recomputed in Python with the inputs above."

