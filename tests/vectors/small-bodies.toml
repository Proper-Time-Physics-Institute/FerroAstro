[[vector]]
id = "SSB-FULL-SET-OFFSET-POS"
requirement = ["NUM-018", "REF-003"]
quantity = "|sum mu_i* r_i| / sum mu_i* at JDEPOC over the header.440 major bodies, the 343 numbered asteroids and the 3 identified KBOs placed from tests/goldens/sb441-n373s-jdepoc-states.csv, and the 36-point KBO ring (relativistic DE440 masses)"
value = 0.0
unit = "km"
kind = "analytic"
source = "DE440 defines the SSB by sum mu_i* r_i = 0 over the Sun, the planetary-system barycentres, Pluto, 343 asteroids, 30 KBOs and the KBO ring (Park et al. 2021, section 2.2, Eqs. 1-2)."
citation = "Park, R. S., Folkner, W. M., Williams, J. G., & Boggs, D. H. 2021, AJ 161, 105, doi:10.3847/1538-3881/abd414, section 2.2"
retrieved = "2026-10-15"
tolerance = { abs = 90.0 }
tolerance_rationale = "B = 89.73 km rounded up: the largest dipole the 27 unplaced KBO masses (MA80nn not identified, total GM 1150.17 km^3/s^2) could add, by the rearrangement bound sum_k GM_(k) (r_(k) + |r_Sun|) / GM_total with the GMs and the remaining 27 TNO heliocentric distances (33.6-102.4 au) each sorted descending, |r_Sun| = 6.84e5 km. Computed from the header and the sampled file before the offset was computed (IMPLEMENTATION-NOTES WP15). The ring is centred on the SSB and adds no dipole. Non-gating while OI-24 (KBO identities, ring geometry) is open."
verified_by = "WP15 builder agent, 2026-10-15: bound derived and computed before the first barycentre run (IMPLEMENTATION-NOTES WP15, check 3)."
blocked_by = "OI-24"

