tolerance_rationale = "Pre-registered in WP6 before the first run: the spread must stay below the NUM-013(a) isolation tolerance (1e-4 arcsec/cy), otherwise the NUM-013(a) comparison would depend on the choice of estimator. Known inputs: WP4 measured passages vs LRL at 4e-7 relative for GR (1.7e-5 arcsec/cy); WP5 measured a 2-day passage-direction error of ~3e-6 arcsec per passage."
