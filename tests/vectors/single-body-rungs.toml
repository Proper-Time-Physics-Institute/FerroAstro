source = "For a single body the estimators measure the same secular advance; their definitions differ only by periodic terms (1PN periodic terms of the osculating LRL vector, sampling and interpolation of passages). The passage and Park2017 estimates agree to <= 2e-8 arcsec/cy, but the 1PN periodic terms of the Newtonian LRL vector do NOT average out under step-time (non-uniform) sampling: the WP6 measurement left a +1.8e-5 arcsec/cy LRL offset for GR (corrected in WP7; the earlier text said they average out). NUM-012 acceptance asks the docs to report the spread."
