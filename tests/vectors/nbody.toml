[[vector]]
id = "NBODY-DE440-OUTER-PLANETS-KM"
requirement = ["NUM-019", "NUM-009"]
quantity = "max over 1969-06-28 .. +10 yr (every 10 d) of the barycentric position residual |r_FerroAstro - r_de440.bsp| for the Jupiter, Saturn, Uranus and Neptune system barycentres; Newtonian + solar J2 (DE440 J2SUN, ASUN, IAU 2015 pole), Sun + 8 planets + geocentric Moon from header.440"
value = 0.0
unit = "km"
kind = "measured"
source = "de440.bsp evaluated by ferroastro-ephem (pinned product, tests/data/MANIFEST.toml); FerroAstro N-body run from header.440 GROUP 1041 ICs."
citation = "JPL DE440 (Park et al. 2021, AJ 161, 105): header.440 sha256 0f4636b663e6f00af9efa2b605ef23635489f56b23dd1a5e3821d3acc6ac3359; de440.bsp sha256 a4ce9bf9b3282becc9f4b2ac3cebe03a2ae7599981aabd7265fd8482fff7c4b5"
retrieved = "2026-10-15"
