[[vector]]
id = "LT-DE440-VS-R3B-REL"
requirement = ["NUM-019", "PHY-011"]
quantity = "max over non-Sun bodies of |a(SolarLenseThirring, DE440 Eqs. 37-38 as 2 Omega x v) - a(LenseThirring, R3b form) at (r_i - r_Sun, v_i - v_Sun)| / |a(R3b)|, synthetic 5-body configuration, gamma = 1 and gamma = 0.999"
value = 0.0
unit = "1"
kind = "analytic"
source = "2 Omega x v with Omega = (1+gamma)G/(2c^2 r^3)[-J + 3(J.r)r/r^2] expands to (1+gamma)GS/(c^2 r^3)[v x s + 3(s.r)(r x v)/r^2], the R3b expression (WP20 notes; checked symbolically by tools/lt_forms.py)."
citation = "Park et al. 2021, AJ 161, 105 (DE440), Eqs. 37-39; Fienga et al. 2021, INPOP21a, IMCCE scientific note, Eq. 1; Journal #4 R3b"
retrieved = "2026-10-20"
