[[vector]]
id = "TESTPO440-MAX-DEL"
requirement = ["REF-001", "DEP-011"]
quantity = "largest DEL = |testpo value - FerroAstro value| over every testpo.440 point with body target and centre (codes 1-13); positions in au, velocities in au/day, AU from header.440"
value = 0.0
unit = "au or au/day"
kind = "measured"
source = "testpo.440 (https://ssd.jpl.nasa.gov/ftp/eph/planets/ascii/de440/testpo.440, sha256 45084a7f406b8e41032e7d99dd8042d4df97a9f752a68c06d1a27af16693429f), evaluated on de440.bsp."
citation = "JPL testeph.f (https://ssd.jpl.nasa.gov/ftp/eph/planets/fortran/testeph.f, sha256 18f32f073c1a345850d9deebc8b53b06c83a386c066b566f65001b51adeb7120, retrieved 2026-10-15), lines 186 and 210: 'The agreement is considered okay if DEL is less than 1e-13'; 'IF (DEL .GE. 1.D-13) WRITE ... WARNING'"
retrieved = "2026-10-15"
tolerance = { abs = 1e-13 }
tolerance_rationale = "JPL's own acceptance threshold for an ephemeris reader, copied (testeph.f compares strictly: DEL >= 1e-13 is a warning; the vector check is <=, which differs only at exactly 1e-13). 1e-13 au = 1.5 cm."
verified_by = "WP10 builder agent, 2026-10-15: threshold read in testeph.f; pre-registered in IMPLEMENTATION-NOTES WP10 before the first run."

[[vector]]
id = "DE440-ASCII-COEFF-MISMATCHES"
requirement = ["DEP-011", "REF-001"]
quantity = "number of de440.bsp Chebyshev coefficients (SSB-centred segments 1-10) whose 16-significant-digit D-format rendering differs from the token in the DE440 ASCII blocks ascp01550/01950/02550.440"
value = 0
unit = "1"
kind = "measured"
source = "DE440 ASCII coefficient files ascp01550.440, ascp01950.440, ascp02550.440 and header.440 GROUP 1050 (pinned in tests/data/MANIFEST.toml)."
citation = "JPL DE440 (Park et al. 2021, AJ 161, 105); ASCII format per header.440 GROUP 1050 (coefficient pointers, counts, sub-intervals) and testeph.f"
retrieved = "2026-10-15"
tolerance = { abs = 0.0 }
tolerance_rationale = "Both products are renderings of the same fit; the ASCII prints 16 significant digits, so the correctly rounded 16-digit rendering of each SPK double must equal the ASCII token exactly. Any record-mapping or layout error gives mismatches."
verified_by = "WP10 builder agent, 2026-10-15: pre-registered in IMPLEMENTATION-NOTES WP10 before the first run."

