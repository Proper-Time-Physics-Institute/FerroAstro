[[vector]]
id = "EPHEM-F64-DD-ROUNDOFF-RATIO"
requirement = ["DEP-007", "DEP-011"]
quantity = "largest rho = |x_f64 - x_DD| / (n u sum_k |c_k|) over all de440 segments, golden epochs and components; for velocities the denominator is n u sum_k k^2 |c_k| 2/INTLEN (u = 2^-53, n = coefficients per component)"
value = 0.0
unit = "1"
kind = "analytic"
source = "First-order rounding size of the Clenshaw recurrence in binary64, n u sum |c_k| for |s| <= 1 (|T_k| <= 1), and n u sum k^2 |c_k| for the derivative (|T'_k| <= k^2)."
citation = "FerroAstro engineering bound (WP10), not a published theorem; no literature was re-opened for it. Double-double accuracy: JMP 2017 (vectors in real-backends.toml)."
retrieved = "2026-10-15"
tolerance = { abs = 2.0 }
tolerance_rationale = "rho <= 2 is read as 'f64 agrees with double-double to binary64 round-off': twice the first-order a-priori size n u sum |c_k|. The time argument is exact for these epochs (0h + fraction split), so it adds nothing."
verified_by = "WP10 builder agent, 2026-10-15: pre-registered in IMPLEMENTATION-NOTES WP10 before the first run."

