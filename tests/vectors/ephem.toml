[[vector]]
id = "HORIZONS-DE441-VS-DE440-POS-GROSS"
requirement = ["DEP-011"]
quantity = "largest |FerroAstro de440 chain - Horizons DE441| barycentric position component (Mercury 199, Earth 399, Moon 301; 21 TDB epochs 1600-2600; ICRF; km)"
value = 0.0
unit = "km"
kind = "measured"
source = "JPL Horizons API vector tables (CENTER 500@0, REF_SYSTEM ICRF, REF_PLANE FRAME, TIME_TYPE TDB, OUT_UNITS KM-S), fetched in the data tier with full provenance."
citation = "JPL Horizons System, https://ssd.jpl.nasa.gov/api/horizons.api (DE441; Park et al. 2021, AJ 161, 105)"
retrieved = "2026-10-15"
tolerance = { abs = 10.0 }
tolerance_rationale = "Gross-error bound only: DE441 is not DE440. A UT/TDB mix-up gives >= 3000 km for Mercury, a wrong frame ~1e7 km, a wrong centre >= 1e5 km. It does NOT catch TT vs TDB (<= 80 m); testpo (TESTPO440-MAX-DEL) covers the time argument. The measured DE440-DE441 difference is reported, not asserted. This check replaces the ANISE cross-check, which the maintainer decision in force excludes."
verified_by = "WP10 builder agent, 2026-10-15: pre-registered in IMPLEMENTATION-NOTES WP10 before the first data run."

