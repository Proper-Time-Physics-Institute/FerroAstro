schema_version = 1

[[vector]]
id = "EPH-REBARY-DD-RESIDUAL-KM"
requirement = ["NUM-018"]
quantity = "|sum mu*_i r_i| / sum mu*_i after 3 fixed-point passes of the relativistic re-barycentring in double-double (header.440 majors + 343 REF-003 asteroids at JDEPOC)"
value = 0.0
unit = "km"
kind = "analytic"
source = "The re-barycentring is a translation; after convergence the residual is the double-double rounding of the weighted sum: N bodies x max |r| x u_DD = 354 x 7.4e9 km x 2^-104 ~ 1.3e-19 km."
citation = "Park et al. 2021, AJ 161, 105, Eqs. 1-2; Subbotin et al. 2023, Eq. 5; WP25 plan check C3"
retrieved = "2026-10-20"
tolerance = { abs = 1.0e-19 }
tolerance_rationale = "Rounding bound of the DD weighted sum (the Sun dominates, so the bound is rounded down). A missed pass or an f64 step in the DD path leaves >= 1e-11 km (the f64 residual)."
verified_by = "WP25 builder agent, 2026-10-20: fixed in the WP25 plan from the DD unit round-off. The probe run before the plan printed the value (disclosed in IMPLEMENTATION-NOTES WP25)."

