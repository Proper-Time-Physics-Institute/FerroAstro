[[vector]]
id = "EPH-MUSTAR-RATE-REL"
requirement = ["NUM-018"]
quantity = "max_i |mu*_i'(analytic) - [mu*_i(t+d) - mu*_i(t-d)]/(2d)| / max_i |mu*_i'| along the Newtonian flow (second-order Taylor states), d = 3600 s, header.440 Sun + 8 planets + Moon, double-double"
value = 0.0
unit = "1"
kind = "analytic"
source = "Central difference error O(d^2 x d^3mu*/dt^3 / mu*'), ~ (d / P_Mercury)^2 ~ (1 h / 88 d)^2 ~ 2e-7; the Taylor states add O(d^3) position error, of the same order."
citation = "Park et al. 2021, Eq. 2 (mu*), differentiated in WP25; WP25 plan check C3"
retrieved = "2026-10-20"
tolerance = { abs = 1.0e-6 }
tolerance_rationale = "5x the estimated truncation of the difference quotient; a sign or factor error in either term of mu*' (v.a or the potential rate) is O(1)."
verified_by = "WP25 builder agent, 2026-10-20: fixed in the WP25 plan before the first run."

[[vector]]
id = "EPH-MIXED-SHORT-RATIO"
requirement = ["NUM-007"]
quantity = "max over 2 yr of |r_f64plain - r_DD| / max over 2 yr of |r_mixed - r_DD| for Mercury, major-body ABM13 PECEC scenario (WP24 abm-sun-planets-moon-eih-40yr with span 2 yr)"
value = 10.0
unit = "1"
kind = "analytic"
source = "f64 ABM round-off grows ~t^1.5 (WP24 B3: 0.5-2.2 m at 40 yr, so ~1-3 cm at 2 yr); the mixed mode rounds only the f64 forces (~0.1 mm at 2 yr from Subbotin's 8.4 mm at 40 yr). A mode that silently kept f64 sums gives a ratio ~1."
citation = "Subbotin et al. 2023, Table 1; IMPLEMENTATION-NOTES WP24 B3; WP25 plan check C4"
retrieved = "2026-10-20"
tolerance = { abs = 0.0 }
tolerance_rationale = "A lower bound: the test asserts ratio >= value (10). Expected ~100; 10 separates a working mixed mode from f64 sums with margin."
verified_by = "WP25 builder agent, 2026-10-20: fixed in the WP25 plan before the first run."

