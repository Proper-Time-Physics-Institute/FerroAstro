[[vector]]
id = "REAL-DD-MULADD-ERR"
requirement = ["DEP-012", "NUM-006"]
quantity = "largest error of double-double mul_add(a, b, c) = a*b + c, divided by |a*b| + |c|, over the DEP-012 property-test inputs"
value = 0.0
unit = "u^2 (2^-106) relative"
kind = "analytic"
source = "mul_add is a DWTimesDW3 product (error <= 5u^2 |ab|, JMP 2017 Thm 5.4) followed by an AccurateDWPlusDW sum (error <= 3u^2 |ab + c| <= 3u^2 (|ab| + |c|) plus the propagated product error, Thm 3.1), so |error| <= (5 + 3 + O(u)) u^2 (|ab| + |c|)."
citation = "Joldes, M., Muller, J.-M. & Popescu, V. 2017, Tight and rigorous error bounds for basic building blocks of double-word arithmetic, ACM TOMS 44(2), 15res, doi:10.1145/3121432 (HAL hal-01351529v3, PDF sha256 2a820178d2ef079559de9940d7af38258fac24558d406be64779ea901486cbc0)"
retrieved = "2026-10-15"
tolerance = { abs = 8.0 }
tolerance_rationale = "Derived from the two proved bounds by the triangle inequality; relative to |ab| + |c| because the sum may cancel."
verified_by = "WP7 builder agent, 2026-10-15: bound copied from the cited theorem (or derived as stated) and written before the first property-test run; measured maxima are reported in IMPLEMENTATION-NOTES WP7."

[[vector]]
id = "REAL-DD-EXP-REL-ERR"
requirement = ["DEP-012", "NUM-006"]
quantity = "largest relative error of the double-double exp over the DEP-012 property-test inputs, x in [-600, 700]"
value = 0.0
unit = "u^2 (2^-106) relative"
kind = "analytic"
source = "FerroAstro algorithm (no published bound): Cody-Waite reduction with a three-word ln 2, 14-term Taylor series of expm1 on r/64 and six doublings expm1(2x) = expm1(x)(expm1(x) + 2), then (1 + expm1) * 2^k. Engineering bound from an operation count: the error is dominated by the last few double-word operations (each <= 5u^2, JMP 2017) plus the reduction, about 30-60 u^2; 128 u^2 (1.6e-30 relative) leaves a factor of two."
citation = "Joldes, M., Muller, J.-M. & Popescu, V. 2017, Tight and rigorous error bounds for basic building blocks of double-word arithmetic, ACM TOMS 44(2), 15res, doi:10.1145/3121432 (HAL hal-01351529v3, PDF sha256 2a820178d2ef079559de9940d7af38258fac24558d406be64779ea901486cbc0); ferroastro-real src/dd_math.rs"
retrieved = "2026-10-15"
tolerance = { abs = 128.0 }
tolerance_rationale = "Pre-registered engineering bound (written before any measurement); not a proof. If a measurement exceeds it, the algorithm is fixed, the bound is not widened without a NEEDS HUMAN REVIEW note."
verified_by = "WP7 builder agent, 2026-10-15: bound copied from the cited theorem (or derived as stated) and written before the first property-test run; measured maxima are reported in IMPLEMENTATION-NOTES WP7."
notes = "NEEDS HUMAN REVIEW (WP7): domain amended after the first run, bound unchanged. The pre-registered domain [-700, 700] reached results below 2^-916 (x < -634.8), where the trailing word of a double-word is subnormal and the format itself cannot hold 106 bits (the JMP 2017 bounds hold barring underflow). The first run failed at x = -688.2 with 2.3e-17 relative error, i.e. binary64 accuracy. The lower end is now -600, chosen from the format limit, not from the measurement."

