schema_version = 1

[[vector]]
id = "REAL-DD-ADD-REL-ERR"
requirement = ["DEP-012", "NUM-006"]
quantity = "largest relative error of double-double add over the DEP-012 property-test inputs (normalised double-words, |exponent| <= 60 for add/sub/mul/scale/div, <= 200 for recip)"
value = 0.0
unit = "u^2 (2^-106) relative"
kind = "analytic"
source = "Proved bound of AccurateDWPlusDW (JMP 2017 Alg. 6), the algorithm ferroastro-real implements. Theorem 3.1: relative error <= 3u^2/(1-4u) < 3u^2 + 13u^3 for p >= 6."
citation = "Joldes, M., Muller, J.-M. & Popescu, V. 2017, Tight and rigorous error bounds for basic building blocks of double-word arithmetic, ACM TOMS 44(2), 15res, doi:10.1145/3121432 (HAL hal-01351529v3, PDF sha256 2a820178d2ef079559de9940d7af38258fac24558d406be64779ea901486cbc0)"
retrieved = "2026-10-15"
tolerance = { abs = 3.0 }
tolerance_rationale = "Proved bound, not a fit. The 13u^3 term is 1.4e-15 u^2, below the resolution of the f64 ratio that reports the error, so the band is 3 u^2."
verified_by = "WP7 builder agent, 2026-10-15: bound copied from the cited theorem (or derived as stated) and written before the first property-test run; measured maxima are reported in IMPLEMENTATION-NOTES WP7."

