# nightly results, recorded so that the orbit viewer's comparison dashboard (API-004, F4 of the
# conformal-gravity plan) can show them without copying numbers into JavaScript. Before this file the
# values lived only in rationale text (eih.toml PHY014-EIH-FULL-RATE, viewer.toml VIEWER-E4/E5) and
# in uncommitted evidence files under another user's target/ directory.
#
