# single-body-rungs.toml). The viewer embeds this file and passes the rows through its metadata
# ("dashboard.m5"); crates/ferroastro-viewer/tests/viewer_dashboard.rs checks the pass-through.
#
# Run provenance (all rows): the M5 E2 nightly run of 2026-11-12/13 (cargo nextest, nightly profile)
# at FerroAstro commit d1ccbae30d308446da84c47c95c9d434dca34b30 (on main), rustc 1.95.0 (59807616e
# 2026-04-14) as pinned by that commit's rust-toolchain.toml, x86_64-unknown-linux-gnu; DE440
# header.440 sha256 0f4636b663e6f00af9efa2b605ef23635489f56b23dd1a5e3821d3acc6ac3359. Run log
# sha256 e0a4d75f057c18ed0667e51be51416b9094c412a42b5d7e4f7a65dbcf3fd527a (m5e2-nightly.log, kept by
# the operator, not committed). Common estimator: Park2017 (NUM-011), Park17 mean-orbit plane, fit
