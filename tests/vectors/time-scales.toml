[[vector]]
id = "HIFITIME-TDB-VS-ERFA-MAX-DIFF"
requirement = ["DEP-010"]
quantity = "largest |hifitime TDB - FerroAstro TDB| (seconds since J2000 TDB) over the 223 golden TT epochs 1550-2650"
value = 0.0
unit = "s"
kind = "analytic"
source = "hifitime 4.3.1 TDB = SPICE one-term model 1.658e-3 s * sin(g + 0.0167 sin g), g' = 1.990910018065731e-7 rad/s (6282.834 rad/millennium) (hifitime src/epoch/mod.rs inner_g). FerroAstro TDB = ERFA dtdb (787-term Fairhead & Bretagnon, main term 6283.076 rad/millennium). Bound written before running hifitime: sum of |A|*|T|^n over all non-main Fairhead terms at |T| = 0.65 millennium = 134.1 us; main-term frequency/phase/amplitude mismatch over |T| <= 0.65 = 262.2 us; JPL-mass terms 0.02 us; total 396 us."
citation = "Fairhead, L. & Bretagnon, P. 1990, A&A 229, 240 (via ERFA 2.0.1 dtdb.c); hifitime 4.3.1 (crates.io, MPL-2.0) src/epoch/mod.rs"
retrieved = "2026-10-15"
tolerance = { abs = 4.0e-4 }
tolerance_rationale = "Analytic bound (396 us, rounded up), not a fit: the two libraries use different TDB series by design (DEP-010 note: 'hifitime's ET is SPICE's approximation'). The measured value is recorded, not the bound."
verified_by = "WP8 builder agent, 2026-10-15: bound computed from the ERFA table and hifitime's published constants before any hifitime run; measured maximum in IMPLEMENTATION-NOTES WP8."

