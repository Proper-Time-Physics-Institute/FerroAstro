# Constants that are exact by definition. They are independent of any ephemeris, so they can serve as
# oracles for the DE440 header.440 entries of the same name (REF-002, PHY-002). Schema: ADR-0004.
schema_version = 1

[[vector]]
id = "CONST-CLIGHT-SI"
requirement = ["PHY-002", "REF-002"]
quantity = "speed of light in vacuum c (DE440 header name CLIGHT)"
value = 299792.458
unit = "km/s"
kind = "defined"
source = "SI definition of the metre: c = 299 792 458 m/s exactly"
citation = "BIPM, The International System of Units (SI), 9th edition (2019), section 2.2 and Table 1"
retrieved = "2026-10-14"
tolerance = { abs = 0.0 }
tolerance_rationale = "Exact by definition. header.440 prints CLIGHT as 0.299792457999999984D+06, the 18-digit rendering of the f64 nearest 299792.458, which parses back to the same double as this value; equality is therefore required."
verified_by = "WP1 agent, 2026-10-14: value is the SI defining constant; cross-checked against JPL DE440 header.440 CLIGHT by the `data` test de440_header_defined_constants"

[[vector]]
id = "CONST-AU-IAU2012"
requirement = ["PHY-002", "REF-002"]
quantity = "astronomical unit au (DE440 header name AU)"
value = 149597870.700
unit = "km"
kind = "defined"
source = "IAU 2012 Resolution B2: the au is a conventional unit of length equal to 149 597 870 700 m exactly"
citation = "IAU 2012 General Assembly, Resolution B2 (re-definition of the astronomical unit of length)"
retrieved = "2026-10-14"
tolerance = { abs = 0.0 }
tolerance_rationale = "Exact by definition. header.440 prints AU as 0.149597870699999988D+09, the 18-digit rendering of the f64 nearest 149597870.7 km, which parses back to the same double; equality is therefore required."
verified_by = "WP1 reviewer agent, 2026-10-14: Resolution B2 text re-opened (SYRTE mirror https://syrte.obspm.fr/IAU_resolutions/Res_IAU2012_B2.pdf, sha256 3489ebb1e51f7c278d56c9e0f9cb49c142e036ac34e21defc87414507afec984), recommends 1: au = 149 597 870 700 m exactly. Independent of DE440 header.440, which the `data` test de440_header_defined_constants checks against this value."
notes = "OI-05 (Resolution text UNVERIFIED) is resolved by the re-reading above; closing it in OPEN-ITEMS.md is left to the requirements PR (#2)."
