[[vector]]
id = "PARK17-GE-RATE"
requirement = ["PHY-004"]
quantity = "gravitoelectric (Schwarzschild-like) contribution to Mercury's perihelion precession, Mercury mean-orbit frame (Park17 Table 3)"
value = 42.9799
unit = "arcsec/cy"
kind = "measured"
source = "Park17 Table 3, row 'Gravitoelectric (Schwarzschild-like)': 42.9799 +/- 0.0009 arcsec/Julian century"
citation = "Park, R. S., Folkner, W. M., Konopliv, A. S., et al. 2017, AJ 153, 121, doi:10.3847/1538-3881/aa5be2, Table 3"
retrieved = "2026-10-14"
tolerance = { abs = 2.7e-3 }
tolerance_rationale = "3 x Park17's quoted 1-sigma (0.0009), pre-registered in IMPLEMENTATION-NOTES WP3 before any run. Used only for the data-tier diagnostic that evaluates the analytic formula with single-epoch osculating (Horizons DE441) a and e; those carry short-period perturbations and Park17's value is a numerical-ephemeris estimate in the mean-orbit frame, so a 1-sigma test would not be meaningful. Not used by the PHY-004 acceptance test."
verified_by = "WP3 builder agent, 2026-10-14: read in the published PDF (iopscience.iop.org/article/10.3847/1538-3881/aa5be2/pdf, sha256 24fb2153f6b78109daa80171cd37006157b73564f8d0ac383532b5c92433380b), Table 3."
