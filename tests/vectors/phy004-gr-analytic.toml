# Rung GR-SCHW analytic (PHY-004) and the published cross-check (Park17 Table 3). Schema: ADR-0004.
schema_version = 1

[[vector]]
id = "PHY004-GR-RATE"
requirement = ["PHY-004"]
quantity = "analytic Schwarzschild perihelion advance rate of Mercury, 6 pi GM/(c^2 a (1-e^2)) x orbits per Julian century, DE440 GM_sun/c/au and SW92 a, e"
value = 42.9805
unit = "arcsec/cy"
kind = "analytic"
source = "PHY-004 acceptance: 42.9805 +/- 0.0001 arcsec/cy; formula Will 2014 Eq. 65 (beta = gamma = 1)"
citation = "Will, C. M. 2014, Living Rev. Relativ. 17, 4, doi:10.12942/lrr-2014-4, Eq. 65; FerroAstro docs/requirements/PHY.md PHY-004"
retrieved = "2026-10-14"
tolerance = { abs = 1.0e-4 }
tolerance_rationale = "The requirement's own tolerance: half a unit in the 4th decimal of the quoted 42.9805. The exact f64 value (red-team recomputation 42.980479) sits 2.1e-5 from it. Changing GM_sun to GM_sun + GM_Mercury moves it by 7e-6, so the check is insensitive to caveat C7 but catches any wrong constant, unit or orbit count at the 2e-6 relative level."
verified_by = "Red-team review 2026-10-14 (REPORT.md section 1) recomputed 42.980479 arcsec/cy, 5.018660e-7 rad/orbit, 415.200918 orbits/cy in Python from the same constants; WP3 builder agent re-derived the formula from Will 2014 Eq. 65."

