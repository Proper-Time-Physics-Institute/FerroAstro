[[vector]]
id = "SW92-MERCURY-VARPI-RATE-VS-DE441"
requirement = ["NUM-011", "PHY-015", "PHY-016"]
quantity = "SW92 Table 1 Mercury long.peri. rate in arcsec/cy, used as the oracle for the dog-leg rate fitted to Horizons DE441 in the J2000 ecliptic over 1800-2050"
value = "577.716804"
unit = "arcsec/cy"
kind = "measured"
source = "SW92 Table 1 Mercury long.peri. rate 0.16047689 deg/cy x 3600 = 577.716804"
citation = 'Standish, E. M. & Williams, J. G. 1992, "Orbital Ephemerides of the Sun, Moon, and Planets", in Explanatory Supplement to the Astronomical Almanac (ed. Seidelmann), ch. 5; Tables 1 and 2a as hosted by JPL SSD at https://ssd.jpl.nasa.gov/planets/approx_pos.html (page sha256 9f7b30ca81cc548a879565bb3f70e6899a38ff5877cb1ff16bb04892f9c4d742 on 2026-10-15)'
retrieved = "2026-10-15"
tolerance = { abs = 20.0 }
tolerance_rationale = "Derived from SW92's own fit quality, not from the result. SW92 quote nominal heliocentric-longitude errors of 15 arcsec for Mercury over 1800-2050 and say the elements are a best fit, not a mean. At fixed mean longitude, d(lambda)/d(varpi) = 1 - df/dM spans [-0.551, +0.327] for e = 0.2056. A rate error delta pivoting at the window centre (half-width 1.25 cy) gives up to 0.551 * 1.25 * delta of longitude error, so 15 arcsec allows |delta| <= 21.8 arcsec/cy, rounded down to 20. SW92's Table 1 and Table 2a fits of one ephemeris differ by 3.9 arcsec/cy, which is consistent with a bound of this size. The check tests frame and definition (ecliptic dog-leg vs mean-orbit projected), not precision."
verified_by = "WP5 builder agent, 2026-10-15: read in the downloaded page (sha256 above, unchanged since WP3); re-checked digit for digit on every run of data_sw92_table1_mercury. Arithmetic: 0.16047689 * 3600 = 577.716804 exactly."

