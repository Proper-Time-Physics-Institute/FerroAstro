citation = "Chambers 1999, MNRAS 304, 793 (Mercury); Everhart 1985 (RA15); Mercury6 used as a black box through mercury6.man, GPL-labelled mirror in a separate container (LIC-001); WP17 plan"
retrieved = "2026-10-15"
tolerance = { abs = 1.0 }
tolerance_rationale = "PROVISIONAL 1 km, pre-registered in the WP17 plan before any run (NEEDS HUMAN REVIEW). RA15's accuracy parameter is a per-step tolerance whose relation to the global error is undocumented, so no sharp expectation was possible; 1 km is the ceiling shared with the other heliocentric oracles: at least 10x below any model or IC error (WP12: tens of km; a GM error of 1e-8 gives ~750 km in Mercury's longitude over 100 yr) while allowing RA15 step-control error and Mercury6's ~15-significant-figure output precision (~1e-5 km at Neptune)."
verified_by = "WP17 builder agent, 2026-10-15: tolerance from the WP17 plan, written before the first Mercury6 run."
generated_by = "tools/oracles/mercury6_runner.py@8a73faa"
engine = { name = "Mercury6", version = "smirik/mercury aee9e0f6 (Chambers package version 6, double-precision fork), gfortran 12.2.0 -O2", settings = "algorithm radau (RA15), accuracy 1e-12, first step 0.5 d, output precision high, no relativity, no user force, J2 = J4 = J6 = 0; masses GM / k^2 with the Gaussian k (checked black-box against element6's semi-major axis to 1e-13)" }
notes = "Measured 2026-10-15 (WP17): about 0.03 km (Mercury at t = 100 yr; margin 0.03). The difference reaches ~10-15 m within 10 yr for every planet and then stays bounded (not secular)."

