# WP16/WP17: tolerances of the oracle comparisons (ferroastro-oracle). The goldens themselves live in
# ci/golden/<tool>/<scenario>/ with MANIFEST.json (CI-003). Derivations and the pre-registration:
# docs/strategy/IMPLEMENTATION-NOTES.md, WP16 and WP17.
schema_version = 1

[[vector]]
id = "ORACLE-STAGE-A-REBOUND-MAX-DR"
requirement = ["CI-005", "REF-005"]
quantity = "largest Euclidean position difference, over the 9 bodies and the 101 yearly output times, between FerroAstro IAS15 (f64) and REBOUND 5.2.2 IAS15 on scenario stage-a-sun-8planets-newton-100yr (Sun + 8 planets with the EMB, Newtonian, header.440 ICs at JDEPOC, 100 Julian years, epsilon 1e-9, first step 0.1 d)"
value = 0.0
unit = "km"
kind = "computed-reference"
source = "REBOUND 5.2.2 IAS15 run in the local ci/oracles/rebound image on the same scenario file; golden ci/golden/rebound/stage-a-sun-8planets-newton-100yr/ with its MANIFEST.json (image digest, runner commit, input and output SHA-256s)"
citation = "Rein & Spiegel 2015, MNRAS 446, 1424 (IAS15); REBOUND 5.2.2 (PyPI, GPL-3.0, used as a black box in a separate container, LIC-001); WP16 plan, crate-plan.json"
retrieved = "2026-10-15"
tolerance = { abs = 1.0e-3 }
tolerance_rationale = "PROVISIONAL 1 m (WP16 plan; NEEDS HUMAN REVIEW). Both codes integrate the same ICs and GMs with an IAS15-class 15th-order Gauss-Radau scheme at epsilon 1e-9, so the difference is step-sequence and round-off error only: REBOUND runs in au, day and G = 1 with GM in au^3/d^2 and its own (PRS23) step criterion, FerroAstro in km and s, and FerroAstro reads header.440 with its own parser (identical ICs up to the unit change, ~1e-8 km at t = 0). Along-track errors grow at most linearly with time over 100 yr (~415 Mercury orbits); with per-orbit relative energy errors of ~1e-15 this is far below 1 m for every body. 1 m sits ~4 orders above that expectation and ~5 orders below the WP12 Newtonian-vs-DE440 differences (tens of km), so it detects any model or IC error while tolerating integrator-implementation noise. Pre-registered in WP16 before the first FerroAstro-vs-REBOUND comparison."
verified_by = "WP16 builder agent, 2026-10-15: tolerance from the WP16 plan, expectation derived above before the comparison was run."
generated_by = "tools/oracles/rebound_runner.py@98ac4bb"
engine = { name = "REBOUND", version = "5.2.2 (with REBOUNDx 5.1.0 installed, unused in stage A)", settings = "IAS15, epsilon 1e-9 (read back), adaptive_mode PRS23 (default), min_dt 0, sim.dt = 0.1 d, G = 1, units au/day, gravity basic, exact_finish_time = 1 at each yearly output" }
notes = "Measured 2026-10-15 (WP16): 7.132e-4 km (Mercury at t = 100 yr; margin 0.71). The pre-registered expectation ('far below 1 m') was WRONG: both runs sit at their f64 round-off floor, not at truncation error. A FerroAstro double-double run (epsilon 1e-11, truncation-converged: DD at 1e-9 and 1e-11 agree to < 0.05 mm) is the reference: FerroAstro f64 is 0.106 m from it, REBOUND f64 0.685 m (epsilon 1e-9), 0.426 m (1e-10) and 1.511 m (1e-11). The difference is therefore dominated by REBOUND's own round-off, and a REBOUND run at epsilon 1e-11 would exceed 1 m against the DD truth. Tolerance and value unchanged; NEEDS HUMAN REVIEW (IMPLEMENTATION-NOTES WP16): the PROVISIONAL 1 m bound has only 1.4x margin over the oracle's round-off at epsilon 1e-9."

[[vector]]
id = "ORACLE-STAGE-A-SWIFTEST-MAX-DR"
requirement = ["REF-007", "CI-002"]
quantity = "largest Euclidean heliocentric position difference, over the 8 planets (EMB) and the 101 yearly output times, between FerroAstro IAS15 (f64, states minus the Sun's) and Swiftest 2026.7.1 WHM (dt = 1/128 d) on scenario stage-a-sun-8planets-newton-100yr (Sun + 8 planets, Newtonian, header.440 ICs at JDEPOC, 100 Julian years)"
value = 0.0
unit = "km"
kind = "computed-reference"
source = "Swiftest 2026.7.1 WHM run in the local ci/oracles/swiftest image on the same scenario file; golden ci/golden/swiftest/stage-a-sun-8planets-newton-100yr/ with its MANIFEST.json (image digest, runner commit, input and output SHA-256s, relative_energy_change)"
citation = "Wisdom & Holman 1991, AJ 102, 1528 (WHM); Wishard et al. 2023, JOSS 8(90), 5409, doi:10.21105/joss.05409 (Swiftest; PyPI 2026.7.1, GPL-3.0-or-later, used as a black box in a separate container, LIC-001); WP17 plan"
retrieved = "2026-10-15"
tolerance = { abs = 60.0 }
tolerance_rationale = "WIDENED after measurement, with a physical derivation (NEEDS HUMAN REVIEW, IMPLEMENTATION-NOTES WP17). The pre-registered PROVISIONAL bound was 1 km (WHM truncation estimate ~0.15 km for Mercury); the measured value 28.68 km (Mars) FAILED it. Cause, measured from Swiftest's own output and independent of FerroAstro: its total energy drifts secularly by -5.04e-10 over the 100 yr (manifest relative_energy_change), proportional to the number of steps (dt 1/32, 1/64, 1/128, 1/256 d give -1.24e-10, -2.5e-10, -5.04e-10, -1.03e-9: about -1.1e-16 per step, a per-step f64 bias, not truncation). A relative energy drift growing linearly to eps gives a mean-motion drift and a phase error (3/4) n T |eps|, i.e. |dr| ~ (3/4) n T |eps| a, which predicts (km) Mercury 57.1, Venus 41.8, EMB 35.6, Mars 28.8, Jupiter 15.6, Saturn 11.6, Uranus 8.1, Neptune 6.5; measured 0.38, 22.5, 17.0, 28.7, 16.7, 11.8, 8.3, 5.8 (Mars to Neptune within 0.9-1.1 of the prediction; the errors grow as t^2, as a drift implies). 60 km is the largest per-body prediction (57.1 km) rounded up. It still detects a missing planet or a GM error of 1e-8 (~750 km in Mercury's longitude), but no longer a 1-km-class integration error: Swiftest at this setting is a weak stage A oracle for the outer bodies."
verified_by = "WP17 builder agent, 2026-10-15: drift model and per-body predictions computed from the manifest's relative_energy_change before the tolerance was changed; the pre-registered 1 km and its failure are recorded here and in IMPLEMENTATION-NOTES."
generated_by = "tools/oracles/swiftest_runner.py@8a73faa"
engine = { name = "Swiftest", version = "2026.7.1", settings = "integrator whm, dt = 0.0078125 d (1/128), units au/day with G*MU = 1 (Gmass bitwise the header values), general_relativity false, close_encounter_check false, heliocentric ICs from header.440, OMP_NUM_THREADS 1" }
notes = "Measured 2026-10-15 (WP17): 28.68 km (Mars at t = 100 yr); Mercury 0.378 km, within the pre-registered 1 km. HELIO at the same dt gives the same outer-body errors (Mercury 2.4 km), dt = 1/64 d changes them non-monotonically (Venus 0.58 km, Jupiter 8.3 km). Swiftest's driver also segfaults intermittently for Sun + one planet (runner retries in a fresh interpreter, attempts in the manifest)."

[[vector]]
id = "ORACLE-STAGE-A-MERCURY6-MAX-DR"
requirement = ["REF-008", "CI-002"]
quantity = "largest Euclidean heliocentric position difference, over the 8 planets (EMB) and the 101 yearly output times, between FerroAstro IAS15 (f64, states minus the Sun's) and Mercury6 RA15 (accuracy 1e-12) on scenario stage-a-sun-8planets-newton-100yr"
value = 0.0
unit = "km"
