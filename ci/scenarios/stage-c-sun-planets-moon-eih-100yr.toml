# Oracle stage C (REF-005, CI-005 PR-fast golden; WP21): Sun, the 8 planets with Earth and Moon
# resolved, EIH 1PN (gr_eih; REBOUNDx gr_full), DE440 GMs, from the DE440 initial conditions in header.440, 100 Julian
# years forward, IAS15 in f64 with the stage A step-control settings stated explicitly. Every body
# is sampled every Julian year. This file is the stage C golden: FerroAstro gr_eih against REBOUNDx 5.1.0 gr_full on this file.
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "stage-c-sun-planets-moon-eih-100yr"
description = "Stage C: Sun + 8 planets + Moon, EIH 1PN, header.440 ICs, 100 yr, IAS15 f64"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "Earth", "Moon", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true

[integrator]
name = "ias15"
precision = "f64"
epsilon = 1e-9
dt0_days = 0.1

[span]
years = 100.0

[output]
cadence_days = 365.25
