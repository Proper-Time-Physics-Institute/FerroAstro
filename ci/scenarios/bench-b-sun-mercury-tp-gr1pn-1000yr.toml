# WP18 speed table, scenario (b) (CI-008): the C-lite test particle (Sun + Mercury, mu = GM of the
# Sun, 1PN Schwarzschild central field, header.440 ICs) over 1000 Julian years (365250 d, a whole
# number of 1/128-d steps and of outputs), sampled yearly. Run by tools/bench/speed_table.sh only.
# The daily twin bench-b-sun-mercury-tp-gr1pn-1000yr-daily.toml supplies the perihelion-rate column.
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "bench-b-sun-mercury-tp-gr1pn-1000yr"
description = "Bench (b): Sun + Mercury test particle, 1PN Schwarzschild, header.440 ICs, 1000 yr, yearly samples"
mode = "test-particle"
bodies = ["Sun", "Mercury"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_1pn_central = true

[integrator]
name = "ias15"
precision = "f64"

[span]
years = 1000.0

[output]
cadence_days = 365.25
sample_bodies = ["Sun", "Mercury"]
