# Oracle stage C (REF-005, CI-005 PR-fast golden; WP21): Sun, the 8 planets with Earth and Moon
# resolved, Newtonian, DE440 GMs, from the DE440 initial conditions in header.440, 100 Julian
# years forward, IAS15 in f64 with the stage A step-control settings stated explicitly. Every body
# is sampled every Julian year. This file is the Newtonian control of the stage C pair (same bodies and settings, no 1PN term).
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "stage-c-sun-planets-moon-newton-100yr"
description = "Stage C: Sun + 8 planets + Moon, Newtonian, header.440 ICs, 100 yr, IAS15 f64"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "Earth", "Moon", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true

[integrator]
name = "ias15"
precision = "f64"
epsilon = 1e-9
dt0_days = 0.1

[span]
years = 100.0

[output]
cadence_days = 365.25
