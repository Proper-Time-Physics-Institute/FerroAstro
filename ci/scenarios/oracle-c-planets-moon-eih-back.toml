# Oracle stage C nightly (WP21; CI-009, REF-005): Sun, the 8 planets with Earth and Moon resolved,
# EIH 1PN (gr_eih; REBOUNDx gr_full), DE440 GMs, header.440 ICs at JDEPOC, one leg backwards to J2000 - 1000 Julian yr - 30 d
# (the Park17 window 1000-3000 CE plus 30 d). The GR contribution is the difference of the eih and
# newton pairs (identical ICs), with one Park2017 estimator for every tool on the merged legs.
# Mercury and the Sun are sampled daily. Run on REBOUND only (tools/oracles/nightly.sh).
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "oracle-c-planets-moon-eih-back"
description = "Oracle C: Sun + 8 planets + Moon, EIH 1PN, header.440 ICs, back leg of 1000-3000 CE, daily samples"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "Earth", "Moon", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true

[integrator]
name = "ias15"
precision = "f64"

[span]
years = -969.5701574264202

[output]
cadence_days = 1.0
sample_bodies = ["Sun", "Mercury"]
