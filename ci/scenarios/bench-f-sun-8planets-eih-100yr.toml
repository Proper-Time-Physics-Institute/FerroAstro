# WP28 speed-table row (NUM-024 speed table; CI-008): row (f), IAS15 in f64 (epsilon 1e-9, dt0 0.1 d, as bench (e)).
# Sun + 8 planets (EMB), EIH 1PN (gr_eih; REBOUNDx gr_full), header.440 ICs, DE440 GMs, 100 Julian
# years, yearly samples. Run by tools/bench/speed_table.sh --suite wp28, never by the nightly
# all-oracle loop. Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "bench-f-sun-8planets-eih-100yr"
description = "Bench (f): Sun + 8 planets (EMB), EIH 1PN, header.440 ICs, 100 yr, IAS15 f64, yearly samples"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "EMB", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true

[integrator]
name = "ias15"
precision = "f64"
epsilon = 1e-9
dt0_days = 0.1

[span]
years = 100.0

[output]
cadence_days = 365.25
