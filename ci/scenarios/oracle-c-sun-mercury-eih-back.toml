# Oracle stage C nightly, single-body isolation (WP21; PHY-005, CI-009, REF-005): Sun + Mercury as two
# bodies with their DE440 GMs, EIH 1PN (gr_eih; REBOUNDx gr_full), header.440 ICs at
# JDEPOC, one leg backwards to J2000 - 1000 Julian yr - 30 d. GR on minus GR off
# with identical ICs, one Park2017 estimator. Mercury and the Sun sampled daily. REBOUND only.
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "oracle-c-sun-mercury-eih-back"
description = "Oracle C: Sun + Mercury, EIH 1PN, header.440 ICs, back leg of 1000-3000 CE, daily samples"
mode = "n-body"
bodies = ["Sun", "Mercury"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true

[integrator]
name = "ias15"
precision = "f64"

[span]
years = -969.5701574264202

[output]
cadence_days = 1.0
sample_bodies = ["Sun", "Mercury"]
