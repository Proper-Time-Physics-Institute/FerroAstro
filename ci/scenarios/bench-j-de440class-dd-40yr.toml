# WP28 (NUM-024, CI-008): the full double-double twin of row (j) (untimed; the round-off column's reference).
# The model: the WP25 reference body set (16 Major bodies: the Sun, the 8 planets with the Moon
# geocentric, Pluto and the EPM2021 five asteroids; the other 338 numbered DE440 asteroids and the
# 30 identified KBOs as Minor bodies; the KBO ring) with the 1PN EIH terms for EVERY moving body
# over the tiered graph (forces.eih_scope = "all", the default; DE440, decision D1 of 2026-10-21),
# not the EPM2021 Major-only EIH of the reference scenario. DE440 GMs, header.440 + REF-003 initial
# conditions, re-barycentred to the relativistic SSB (Subbotin et al. 2023 Eq. 5); ABM13 PECEC at
# h = 1/16 d with the DP8 start-up at h/8, 40 Julian years (233 760 steps); every body every 20 d.
# Run by tools/bench/speed_table.sh --suite wp28. Schema: scenario.schema.json (CI-002).
# NOTE (M5 review #18, B1): speed row (j) and the (i) -> (j) comparison in IMPLEMENTATION-NOTES WP28
# were measured when this scenario ran the WP19 Major-only EIH; they are superseded and must be
# re-measured under the all-body EIH it runs now.
schema_version = 1
name = "bench-j-de440class-dd-40yr"
description = "Bench (j) truth: the DE440-class model in full double-double (untimed round-off reference)"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "Earth", "Moon", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune", "Pluto"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"
barycentre = "relativistic"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true
sun_j2 = true
lense_thirring = true
asteroids = 343
major_asteroids = "epm2021"
kbos = true
kbo_ring = true

[integrator]
name = "abm"
precision = "dd"
order = 13
corrector = "pecec"
step_days = 0.0625
compensated = true

[span]
years = 40.0

[output]
cadence_days = 20.0
