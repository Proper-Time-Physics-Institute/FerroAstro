# WP21 speed-table row, scenario (e) (CI-008, REF-005): scenario (a) with the EIH 1PN N-body equations
# switched on (gr_eih; REBOUNDx gr_full), otherwise identical (Sun + 8 planets with the EMB,
# header.440 ICs, IAS15 f64, epsilon 1e-9, dt0 0.1 d, 1000 Julian years, yearly samples).
# Run by tools/bench/speed_table.sh for every tool, never by the nightly all-oracle loop.
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "bench-e-sun-8planets-eih-1000yr"
description = "Bench (e): Sun + 8 planets (EMB), EIH 1PN (gr_eih), header.440 ICs, 1000 yr, IAS15 f64, yearly samples"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "EMB", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true
gr_eih = true

[integrator]
name = "ias15"
precision = "f64"
epsilon = 1e-9
dt0_days = 0.1

[span]
years = 1000.0

[output]
cadence_days = 365.25
