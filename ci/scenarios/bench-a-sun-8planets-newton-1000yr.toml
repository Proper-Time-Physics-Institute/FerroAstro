# WP18 speed table, scenario (a) (CI-008): stage A's physics and IAS15 settings (Sun + 8 planets with
# the Earth-Moon barycentre as one body, Newtonian, header.440 ICs, epsilon 1e-9, dt0 0.1 d) over
# 1000 Julian years, every body sampled yearly (coarse, so output I/O does not dominate the timing).
# Run by tools/bench/speed_table.sh for every tool, never by the nightly all-oracle loop.
# The daily twin bench-a-sun-8planets-newton-1000yr-daily.toml supplies the perihelion-rate column.
# Schema: scenario.schema.json (CI-002).
schema_version = 1
name = "bench-a-sun-8planets-newton-1000yr"
description = "Bench (a): Sun + 8 planets (EMB), Newtonian, header.440 ICs, 1000 yr, IAS15 f64, yearly samples"
mode = "n-body"
bodies = ["Sun", "Mercury", "Venus", "EMB", "Mars", "Jupiter", "Saturn", "Uranus", "Neptune"]
central_body = "Sun"

[initial_conditions]
source = "de440-header"

[constants]
gm_set = "de440"

[forces]
newton = true

[integrator]
name = "ias15"
precision = "f64"
epsilon = 1e-9
dt0_days = 0.1

[span]
years = 1000.0

[output]
cadence_days = 365.25
