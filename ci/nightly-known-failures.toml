#
# Known nightly-tier failures (WP28; progress review W3 after WP26). Every entry is a pre-registered
# bound that fails, is disclosed with a NEEDS HUMAN REVIEW item, and was NOT loosened. The list
# changes no bound and no test: `tools/nightly_summary.py` reads it with a nextest log and labels
# each failure "known (value unchanged)", "known (value changed)" or "NEW", so that a new
# regression stands out from the known failures. Remove an entry only when its NEEDS HUMAN REVIEW
# item is resolved (and record that in IMPLEMENTATION-NOTES).
#
# Fields: test (nextest test name), vector (the failing vector id, or a check name), review (where
# the NEEDS HUMAN REVIEW item is), last_value + unit (the last measured value), measured_on,
# value_regex (one capture group: the measured value in the test's output, in `unit`) and
# rel_change (the relative difference above which the value counts as changed; it reflects the
# digits the test prints).
schema_version = 1

[[failure]]
test = "nightly_abm_vs_ias15_forty_year_mercury_bound"
vector = "ABM-VS-IAS15-MERCURY-40YR-DR"
review = "IMPLEMENTATION-NOTES WP24 (B2, PROVISIONAL 1 m bound) and the WP26 progress review W3"
last_value = 0.002073811
unit = "km"
measured_on = "2026-11-12, M5 review fixes (the same f64-vs-f64 comparison inside nightly_abm_vs_ias15_forty_years_in_double_double, printed to 7 digits; 2.241986e-3 km at 6cae36b before the M4/D1 merge changed the EIH summation order)"
value_regex = 'id: "ABM-VS-IAS15-MERCURY-40YR-DR".*?measured: ([0-9.eE+-]+)'
rel_change = 1e-6 # the last value was read from a 7-digit print (M5 review fixes)

