# License / advisory / source gating (DEP-001..003, STD-006) and the native-library feature audit (DEP-016).

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
# MPL-2.0 only for reviewed crates, used unmodified (DEP-002, DEP-004).
# anise is not a dependency; decision deferred to M5 (OI-16, OI-72).
exceptions = [
    { allow = ["MPL-2.0"], crate = "hifitime" },
]

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # AGPL / GPL / LGPL, banned by name whatever their declared license (DEP-003).
    { crate = "nyx-space", reason = "AGPL-3.0-or-later" },
    { crate = "rug", reason = "LGPL; GMP/MPFR; no wasm32" },
    { crate = "gmp-mpfr-sys", reason = "LGPL native libs" },
    { crate = "cspice-sys", reason = "LGPL-3.0" },
    { crate = "librebound-sys", reason = "GPL-3.0; clean-room rule (DEP-008)" },
    { crate = "libassist-sys", reason = "GPL-3.0" },
    { crate = "adam_assist", reason = "GPL-3.0" },
    { crate = "rebound-rs", reason = "GPL-3.0" },
    { crate = "thor-rs-assist", reason = "provenance unverified (DEP-015)" },
    { crate = "erfars", reason = "archived" },
    # Native-library crates behind optional features of permissive crates (DEP-016). Banning the
    # crate fails the check whichever feature of whichever dependency pulls it in.
    { crate = "suitesparse_sys", reason = "SuiteSparse native libraries (DEP-016)" },
    { crate = "sundials-sys", reason = "SUNDIALS native libraries (DEP-016)" },
    { crate = "lapack-src", reason = "LAPACK native backend (DEP-016)" },
    { crate = "lapack-sys", reason = "LAPACK native bindings (DEP-016)" },
    { crate = "blas-src", reason = "BLAS native backend (DEP-016)" },
    { crate = "blas-sys", reason = "BLAS native bindings (DEP-016)" },
    { crate = "openblas-src", reason = "OpenBLAS native library (DEP-016)" },
    { crate = "netlib-src", reason = "Netlib BLAS/LAPACK native library (DEP-016)" },
    { crate = "intel-mkl-src", reason = "Intel MKL native library (DEP-016)" },
    { crate = "accelerate-src", reason = "Apple Accelerate native library (DEP-016)" },
]

# DEP-016 feature audit, by feature name as well: the diffsol features that enable its optional
# suitesparse_sys dependency (diffsol 0.20.0: `suitesparse` and `sundials`), and the russell_sparse
# features that select a native solver or BLAS backend (russell_sparse 5.6.0). Neither crate is a
# dependency today; the entries bite if one is added with such a feature.
[[bans.features]]
crate = "diffsol"
deny = ["suitesparse", "sundials"]
reason = "native SuiteSparse/SUNDIALS (DEP-016)"

[[bans.features]]
crate = "russell_sparse"
deny = ["umfpack", "mumps", "intel_mkl", "open_blas"]
reason = "native UMFPACK/MUMPS/MKL/OpenBLAS (DEP-016)"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
