# Python tooling (reference comparison, report generation, oracle drivers).
# CI gates (STD-009): `uv run ruff check`, `uv run ruff format --check`, `uv run mypy`.

[project]
name = "ferroastro-tools"
version = "0.0.0"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "numpy",
    "pyyaml",
    "jsonschema",
    "jplephem==2.24",
    "sympy>=1.13",
]

[dependency-groups]
dev = ["ruff", "mypy", "pytest", "pre-commit", "reuse", "types-PyYAML", "types-jsonschema"]
# Computed-reference generators (TST-003, REF-009): pinned oracle engines, run by tools/goldens/*.
goldens = ["pyerfa==2.0.1.5"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # isort
    "N",       # pep8-naming
    "UP",      # pyupgrade
    "B",       # bugbear
    "SIM",     # simplify
    "C4",      # comprehensions
    "PTH",     # pathlib
    "NPY",     # numpy
    "RUF",     # ruff-specific
    "D",       # pydocstyle (must be selected explicitly)
    "ANN",     # annotations (pairs with mypy --strict)
    "PL",      # pylint subset
    "PT",      # pytest style
    "S",       # bandit subset (subprocess calls to oracle containers)
]
ignore = [
    "PLR2004",       # magic numbers: physical values live in tests/vectors/*.toml instead
    "N803", "N806",  # physics names such as GM, J2
]

[tool.ruff.lint.pydocstyle]
convention = "numpy"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D", "S101", "ANN"]

[tool.ruff.format]
quote-style = "double"
docstring-code-format = true

[tool.mypy]
strict = true
python_version = "3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers"

[[tool.mypy.overrides]]
# pyerfa ships no type information; it is only installed with the `goldens` group.
module = ["erfa", "erfa.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# jplephem (MIT, the REF-004 reference reader) ships no type information.
module = ["jplephem", "jplephem.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# REBOUND/REBOUNDx (GPL-3.0) exist only inside the ci/oracles/rebound image (LIC-001, red-team
# L4/L12): never a dependency of tools/, so mypy cannot see them.
module = ["rebound", "rebound.*", "reboundx", "reboundx.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Swiftest (GPL-3.0-or-later) exists only inside the ci/oracles/swiftest image (LIC-001, red-team
# L4/L12): never a dependency of tools/, so mypy cannot see it.
module = ["swiftest", "swiftest.*"]
ignore_missing_imports = true
