# cargo-nextest profiles (STD-008, testing.md tiers).

[profile.default]
# PR-fast tier. #[ignore]d tests (network `data_*` and nightly long runs) are skipped.
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.data]
# Real-data tier: `cargo nextest run --workspace --profile data --run-ignored only`.
# Only tests named data_* run; they download into $FA_DATA_DIR (default target/fa-data) and print
# their provenance (URL, retrieval date, SHA-256), so show their output even when they pass.
default-filter = "test(/^data_/)"
fail-fast = false
# No test-level retries: a retried physics assertion would pass as FLAKY (WP6 review). Download
# retries happen inside ferroastro-testdata (curl --retry 3 --retry-connrefused) and the Horizons
# client (one re-fetch of an unparsable answer), i.e. for network errors only.
retries = 0
success-output = "immediate"
slow-timeout = { period = "120s", terminate-after = 5 }

# Review F4 after WP10: JPL Horizons answers HTTP 503 to parallel requests from one IP. Every data
# test that queries Horizons runs in this group, one at a time. This changes scheduling only:
# assertions are untouched and test-level `retries` stays 0.
[[profile.data.overrides]]
filter = "test(/horizons/) | binary(data_single_body) | binary(data_horizons_frames) | binary(data_horizons_mercury) | binary(data_park2017_horizons)"
test-group = "horizons"

[test-groups]
horizons = { max-threads = 1 }

[profile.ci]
fail-fast = false
slow-timeout = { period = "60s", terminate-after = 10 }

[profile.nightly]
# Nightly long-run tier (testing.md): `cargo nextest run --workspace --cargo-profile release --profile nightly --run-ignored only`.
# Only tests named nightly_* run (e.g. the NUM-023 Brouwer-law ensemble); their output is the evidence.
default-filter = "test(/^nightly_/)"
fail-fast = false
success-output = "immediate"
slow-timeout = { period = "300s", terminate-after = 6 }
