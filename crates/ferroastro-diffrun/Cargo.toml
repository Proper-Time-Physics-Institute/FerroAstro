[package]
name = "ferroastro-diffrun"
description = "Differential-run harness: runs from identical initial conditions with toggled bodies or force terms, one precession estimator, contribution and cross-term tables (NUM-013, PHY-012, CI-009)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ferroastro-core.workspace = true
ferroastro-precession.workspace = true
ferroastro-propagate.workspace = true
ferroastro-scenario.workspace = true
postcard.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true

[features]
default = []
# Run-level parallelism over the legs of a plan (rayon). Off on wasm32.
parallel = ["dep:rayon", "ferroastro-propagate/parallel"]

[dev-dependencies]
ferroastro-analytic.workspace = true
ferroastro-constants.workspace = true
ferroastro-frames.workspace = true
ferroastro-testdata.workspace = true
ferroastro-vectors.workspace = true

[lints]
workspace = true
