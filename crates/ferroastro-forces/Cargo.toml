[package]
name = "ferroastro-forces"
description = "Force models for FerroAstro (each labels its gauge); M0: Newtonian point masses; M2 single-body rungs; M3 tiered N-body"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ferroastro-core.workspace = true
ferroastro-ephem.workspace = true
ferroastro-integrators.workspace = true
ferroastro-real.workspace = true
ferroastro-system.workspace = true
thiserror.workspace = true
# Safe SIMD lanes for the SoA kernels (NUM-021, WP26; DEP-015 record in IMPLEMENTATION-NOTES).
wide = { workspace = true, optional = true }

[features]
default = []
# SIMD (wide f64x4) lanes for the SoA kernels; bitwise identical to the scalar lanes.
simd = ["dep:wide"]

[dev-dependencies]
astro-float.workspace = true
criterion.workspace = true
ferroastro-constants.workspace = true
ferroastro-frames.workspace = true
ferroastro-testdata.workspace = true
ferroastro-vectors.workspace = true

[[bench]]
name = "num009_tiers"
harness = false

[lints]
workspace = true
