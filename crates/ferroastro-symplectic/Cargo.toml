[package]
name = "ferroastro-symplectic"
description = "Clean-room Wisdom-Holman / WHFast symplectic integrator in Jacobi coordinates with derived symplectic correctors, for Newtonian and GR-effective-potential models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ferroastro-analytic.workspace = true
ferroastro-core.workspace = true
ferroastro-ephem.workspace = true
ferroastro-forces.workspace = true
ferroastro-integrators.workspace = true
ferroastro-real.workspace = true
ferroastro-system.workspace = true
serde = { workspace = true, optional = true }

[features]
default = []
# Serialize/Deserialize for the settings, counters and checkpoint snapshots (CI-010).
serde = ["dep:serde", "ferroastro-integrators/serde"]

[dev-dependencies]
ferroastro-vectors.workspace = true
postcard.workspace = true

[lints]
workspace = true
