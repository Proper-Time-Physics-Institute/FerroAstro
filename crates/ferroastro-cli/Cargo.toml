[package]
name = "ferroastro-cli"
description = "The ferroastro command-line tool (M2: `ferroastro ladder --rungs single-body`; M3: `ferroastro scenario validate|run|resume`)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[[bin]]
name = "ferroastro"
path = "src/main.rs"

[dependencies]
ferroastro-constants.workspace = true
ferroastro-core.workspace = true
ferroastro-ladder.workspace = true
ferroastro-vectors.workspace = true
ferroastro-ephem.workspace = true
ferroastro-propagate = { workspace = true, features = ["parallel"] }
ferroastro-scenario.workspace = true
sha2.workspace = true

[features]
default = []
# SIMD lanes of the SoA kernels (bitwise identical to the scalar lanes; NUM-021, WP26).
simd = ["ferroastro-propagate/simd"]

[dev-dependencies]
ferroastro-testdata.workspace = true

[lints]
workspace = true
