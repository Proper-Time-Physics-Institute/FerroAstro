[package]
name = "ferroastro-propagate"
description = "Run driver: builds system, forces and integrator from a scenario, streams states and perihelion passages, checkpoint/resume with bitwise continuation, batch runs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true

[dependencies]
ferroastro-analytic.workspace = true
ferroastro-constants.workspace = true
ferroastro-core.workspace = true
ferroastro-eih.workspace = true
ferroastro-ephem.workspace = true
ferroastro-forces.workspace = true
ferroastro-frames.workspace = true
ferroastro-abm = { workspace = true, features = ["serde"] }
ferroastro-integrators = { workspace = true, features = ["serde"] }
ferroastro-precession.workspace = true
ferroastro-real.workspace = true
ferroastro-scenario.workspace = true
ferroastro-symplectic = { workspace = true, features = ["serde"] }
ferroastro-system.workspace = true
postcard.workspace = true
rayon = { workspace = true, optional = true }
serde.workspace = true
thiserror.workspace = true

[features]
default = []
# Run-level parallelism for batches (NUM-022). Off on wasm32.
parallel = ["dep:rayon"]
# SIMD lanes of the SoA kernels (`integrator.force_kernel = "soa"`, NUM-021, WP26); results are
# bitwise identical with and without it.
simd = ["ferroastro-forces/simd", "ferroastro-eih/simd"]

[dev-dependencies]
ferroastro-testdata.workspace = true
ferroastro-vectors.workspace = true

[lints]
workspace = true
