open_item = "OI-04"

[[constant]]
name = "ASUN"
unit = "km"
quantity = "equatorial radius of the Sun (J2 reference radius)"
citation = ["DE440hdr", "Park21"]
unit_basis = "Park21 Sec. 3.4 (LT acceleration, after Eq. 39): the Sun's equatorial radius (vector DE440-ASUN)"

[[constant]]
name = "J2SUN"
unit = "1"
