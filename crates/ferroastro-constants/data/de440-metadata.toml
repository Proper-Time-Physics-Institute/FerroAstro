# DE440 constants METADATA (PHY-002, REF-002). It holds NO VALUE (maintainer decision 2026-11-14, #22):
# every number is read at run time from the JPL header.440, fetched by tools/fetch_jpl.py and verified
# against the SHA-256 below (which must equal the de440-header pin of tests/data/MANIFEST.toml).
# Per constant: the header name, unit, quantity, citations, why the unit is right (`unit_basis`) and,
# for entries that must not be used as oracles, the `open_item` (AGENTS.md rule 8). Header order.
# Hand-maintained; checked by tests/metadata_consistency.rs. A `token` or `value` key is refused.
schema_version = 2
metadata_version = 2
ephemeris = "DE440"

[source]
product = "de440-header"
url = "https://ssd.jpl.nasa.gov/ftp/eph/planets/ascii/de440/header.440"
sha256 = "0f4636b663e6f00af9efa2b605ef23635489f56b23dd1a5e3821d3acc6ac3359"
bytes = 22802
retrieved = "2026-10-15"
last_modified = "Tue, 22 Dec 2020 00:51:11 GMT"

[citations]
DE440hdr = "JPL Solar System Dynamics, DE440 ASCII header header.440, GROUP 1040/1041, https://ssd.jpl.nasa.gov/ftp/eph/planets/ascii/de440/header.440 (sha256 0f4636b663e6f00af9efa2b605ef23635489f56b23dd1a5e3821d3acc6ac3359)"
Park21 = "Park, R. S., Folkner, W. M., Williams, J. G. & Boggs, D. H. 2021, The JPL Planetary and Lunar Ephemerides DE440 and DE441, AJ 161, 105, doi:10.3847/1538-3881/abd414"

[[constant]]
name = "DENUM"
unit = "1"
quantity = "development ephemeris number"
citation = ["DE440hdr"]
unit_basis = "identifier"

[[constant]]
name = "JDEPOC"
unit = "d"
quantity = "epoch of the initial conditions, Julian date"
citation = ["DE440hdr"]
unit_basis = "Julian date (REF-002 acceptance); the DE ephemeris argument is TDB"

[[constant]]
name = "CENTER"
unit = "1"
quantity = "centre of the initial-condition states (flag)"
citation = ["DE440hdr"]
unit_basis = "flag; whether 0 means the solar-system barycentre in ICRF is an open item"
open_item = "OI-23"

[[constant]]
name = "CLIGHT"
unit = "km/s"
quantity = "speed of light c"
citation = ["DE440hdr"]
unit_basis = "equals the SI defining value of c (vector CONST-CLIGHT-SI)"

[[constant]]
name = "BETA"
unit = "1"
quantity = "PPN parameter beta"
citation = ["DE440hdr"]
unit_basis = "dimensionless"

[[constant]]
name = "GAMMA"
unit = "1"
quantity = "PPN parameter gamma"
citation = ["DE440hdr"]
unit_basis = "dimensionless"

[[constant]]
name = "AU"
unit = "km"
quantity = "astronomical unit"
citation = ["DE440hdr"]
unit_basis = "equals the IAU 2012 Resolution B2 astronomical unit (vector CONST-AU-IAU2012)"

[[constant]]
name = "EMRAT"
unit = "1"
quantity = "Earth/Moon mass ratio"
citation = ["DE440hdr", "Park21"]
unit_basis = "dimensionless; agrees with GMEarth/GMMoon of Park21 Table 2 to the 1e-10 relative precision of the printed GMs (vector DE440-EMRAT)"

[[constant]]
name = "GM1"
unit = "au^3/d^2"
quantity = "GM of Mercury"
citation = ["DE440hdr", "Park21"]
unit_basis = "GM in au^3/d^2: converting with AU (km) and 86400 s/d reproduces the km^3 s^-2 values of Park21 Table 2 (checked by the PHY-002 tests)"

[[constant]]
name = "GM2"
unit = "au^3/d^2"
quantity = "GM of Venus"
citation = ["DE440hdr", "Park21"]
unit_basis = "GM in au^3/d^2: converting with AU (km) and 86400 s/d reproduces the km^3 s^-2 values of Park21 Table 2 (checked by the PHY-002 tests)"

[[constant]]
