citation = ["DE440hdr"]
unit_basis = "dimensionless zonal harmonic referred to ASUN"

[[constant]]
name = "MOISUN"
unit = "1"
quantity = "polar moment of inertia of the Sun, C/(M R^2)"
citation = ["DE440hdr", "Park21"]
unit_basis = "Park21 Sec. 3.4 (after Eq. 39): C/(M R^2) (vector DE440-MOISUN)"

[[constant]]
name = "OMGSUN"
unit = "rad/d"
quantity = "rotation rate of the Sun"
citation = ["DE440hdr", "Park21"]
unit_basis = "Park21 Sec. 3.4 (after Eq. 39) quotes the rotation rate in deg/day, which the header value in rad/d reproduces to the printed digits (vector PARK21-OMGSUN-DEGD, checked by the PHY-002 tests)"
